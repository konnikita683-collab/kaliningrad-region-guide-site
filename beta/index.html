<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>Гайд по Калининградской области — Beta 0.9</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4eee4;color:#1f2a2b;display:grid;place-items:center;min-height:100vh}.load{padding:24px;text-align:center}.load b{display:block;font-size:20px;margin-bottom:8px}.muted{color:#6d736e;font-size:14px}.err{max-width:560px;line-height:1.5}
</style>
</head>
<body>
<div class="load"><b>Гайд по Калининградской области</b><div class="muted">Загрузка Beta 0.9…</div></div>
<script>
(async()=>{
  try{
    // One-time migration BEFORE the embedded Beta code starts.
    // The old build had Zelenogradsk + Svetlogorsk selected by default,
    // which immediately split a 24–28 trip into 24–26 / 26–28 stays.
    const stateFix='20260824-lodging-state-v3';
    if(localStorage.getItem('guideWebStateFix')!==stateFix){
      let prev={};
      try{prev=JSON.parse(localStorage.getItem('guideOnboarding')||'{}')||{};}catch(_){prev={};}
      const clean={
        step:0,
        adults:Math.max(1,Number(prev.adults)||2),
        children:Math.max(0,Number(prev.children)||0),
        cities:[],
        housing:prev.housing||'have',
        car:prev.car||'maybe',
        carDays:Math.max(1,Number(prev.carDays)||2),
        interests:Array.isArray(prev.interests)&&prev.interests.length?prev.interests:['sea','nature']
      };
      // Preserve trip dates if they were already entered, but never preserve
      // the stale city split from the old build.
      if(/^\d{4}-\d{2}-\d{2}$/.test(String(prev.start||'')))clean.start=prev.start;
      if(/^\d{4}-\d{2}-\d{2}$/.test(String(prev.end||'')))clean.end=prev.end;
      localStorage.setItem('guideOnboarding',JSON.stringify(clean));
      localStorage.removeItem('guideLodgingOnboarding');
      localStorage.removeItem('guideLodgings');
      localStorage.removeItem('guideGuestAges');
      localStorage.setItem('guideWebStateFix',stateFix);
    }

    const files=['part-000.txt','p001-0.txt','p001-1.txt','p001-2.txt','p001-3.txt','p001-4.txt','p001-5.txt','p001-6.txt','part-002.txt','part-003.txt','part-004.txt','part-005.txt','part-006.txt'];
    const stamp='20260824-state-v3';
    const parts=await Promise.all(files.map(async name=>{
      const r=await fetch('./data/'+name+'?v='+stamp,{cache:'no-store'});
      if(!r.ok)throw new Error(name);
      let text=await r.text();
      if(name.startsWith('p001-'))text=text.slice(text.indexOf('\n')+1);
      return text;
    }));
    const encoded=parts.join('').replace(/\s+/g,'');
    const binary=atob(encoded);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    if(!('DecompressionStream' in window))throw new Error('browser');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    const patched=html.replace('</body>','<script src="./hotfix-0.9.js?v='+stamp+'"><\/script></body>');
    document.open();
    document.write(patched);
    document.close();
  }catch(e){
    document.body.innerHTML='<div class="load err"><b>Не удалось открыть тестовую версию</b><div class="muted">Обновите Chrome или Safari и откройте ссылку ещё раз.</div></div>';
  }
})();
</script>
</body>
</html>
