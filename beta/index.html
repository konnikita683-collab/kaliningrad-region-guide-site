<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>Гайд по Калининградской области — Beta 0.9 source fix</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4eee4;color:#1f2a2b;display:grid;place-items:center;min-height:100vh}.load{padding:24px;text-align:center}.load b{display:block;font-size:20px;margin-bottom:8px}.muted{color:#6d736e;font-size:14px}.err{max-width:620px;line-height:1.5}
</style>
</head>
<body>
<div class="load"><b>Гайд по Калининградской области</b><div class="muted">Проверка исходного расчёта проживания…</div></div>
<script>
(async()=>{
  try{
    const params=new URLSearchParams(location.search||'');
    const stateFix='20260824-source-v4';
    const forceReset=params.get('reset')==='source-v4';
    if(forceReset||localStorage.getItem('guideWebStateFix')!==stateFix){
      localStorage.removeItem('guideOnboarding');
      localStorage.removeItem('guideLodgingOnboarding');
      localStorage.removeItem('guideLodgings');
      localStorage.removeItem('guideGuestAges');
      localStorage.setItem('guideWebStateFix',stateFix);
    }

    const files=['part-000.txt','p001-0.txt','p001-1.txt','p001-2.txt','p001-3.txt','p001-4.txt','p001-5.txt','p001-6.txt','part-002.txt','part-003.txt','part-004.txt','part-005.txt','part-006.txt'];
    const stamp='20260824-source-v4';
    const parts=await Promise.all(files.map(async name=>{
      const r=await fetch('./data/'+name+'?v='+stamp,{cache:'no-store'});
      if(!r.ok)throw new Error('Не загружен '+name);
      let text=await r.text();
      if(name.startsWith('p001-'))text=text.slice(text.indexOf('\n')+1);
      return text;
    }));
    const encoded=parts.join('').replace(/\s+/g,'');
    const binary=atob(encoded);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    if(!('DecompressionStream' in window))throw new Error('Браузер не поддерживает распаковку beta');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    let html=await new Response(stream).text();

    function replaceRequired(re,replacement,label){
      const next=html.replace(re,replacement);
      if(next===html)throw new Error('Не найден участок исходного кода: '+label);
      html=next;
    }

    // 1. Никаких заранее выбранных городов — ни в старом ядре, ни в onboarding.
    replaceRequired(/const selected=\[[^\]]*\];/,'const selected=[];','core selected cities');
    replaceRequired(/var state=Object\.assign\(\{step:0,adults:2,children:0,cities:\[[^\]]*\],housing:/,'var state=Object.assign({step:0,adults:2,children:0,cities:[],housing:','onboarding default cities');

    // 2. Разрешаем снять последний выбранный город. Валидация на «Далее» всё равно не даст продолжить без города.
    replaceRequired(/if\(i>=0\)\{if\(state\.cities\.length>1\)state\.cities\.splice\(i,1\)\}else state\.cities\.push\(v\)/,'if(i>=0){state.cities.splice(i,1)}else state.cities.push(v)','city toggle');

    // 3. Сохраняем ответы onboarding после каждого шага, а не только в самом конце.
    replaceRequired(/function next\(\)\{capture\(\);/,'function next(){capture();save(state);','onboarding step persistence');

    // 4. Период поездки берём прежде всего из актуального onboarding.
    replaceRequired(/function dates\(\)\{[\s\S]*?\}\s*function syncGuideLodgings/,
      "function dates(){var ob=read('guideOnboarding',{});return{start:ob.start||meta.start||(q('#start')&&q('#start').value)||'',end:ob.end||meta.end||(q('#end')&&q('#end').value)||''};}\n  function syncGuideLodgings",
      'trip dates source');

    // 5. При изменении набора городов периоды пересчитываются с нуля.
    // Для одного города он ВСЕГДА занимает всю поездку.
    replaceRequired(/function ensureStayDates\(cities\)\{[\s\S]*?\}\s*function validate/,
      "function ensureStayDates(cities){var auto=split(cities),changed=false,selectionChanged=!sameOrder(meta.cityOrder||[],cities);if(selectionChanged||cities.length===1){var rebuilt={};auto.forEach(function(x){var old=meta.cities[x.city]||{};rebuilt[x.city]=Object.assign({},old,{start:x.start,end:x.end});});meta.cities=rebuilt;meta.cityOrder=cities.slice();changed=true;}else{auto.forEach(function(x){meta.cities[x.city]=meta.cities[x.city]||{};var c=meta.cities[x.city];if(!c.start||!c.end){c.start=x.start;c.end=x.end;changed=true;}});Object.keys(meta.cities).forEach(function(city){if(cities.indexOf(city)<0){delete meta.cities[city];changed=true;}});}if(changed)persist();else syncGuideLodgings();return auto;}\n  function validate",
      'stay recalculation');

    const close='<'+'/script>';
    html=html.replace('</body>','<script src="./hotfix-0.9.js?v='+stamp+'">'+close+'<script>(function(){var e=document.createElement("div");e.textContent="SOURCE FIX V4";e.style.cssText="position:fixed;right:10px;top:10px;z-index:100000;padding:5px 8px;border-radius:999px;background:#263633;color:white;font:800 10px/1 system-ui;pointer-events:none";document.body.appendChild(e);})();'+close+'</body>');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML='<div class="load err"><b>Исправленная версия не запущена</b><div class="muted">'+String(e&&e.message||e)+'</div></div>';
  }
})();
</script>
</body>
</html>
