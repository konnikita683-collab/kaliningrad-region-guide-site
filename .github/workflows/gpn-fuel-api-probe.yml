name: GPN Fuel API Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gpn-fuel-api-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Download Gazpromneft APK and inspect network endpoints
        shell: bash
        run: |
          set -u
          git clone -q https://github.com/kiber-io/apkdgo.git /tmp/apkdgo
          cd /tmp/apkdgo && go build -o /tmp/apkd ./apkd
          mkdir -p /tmp/gpn
          /tmp/apkd -s apkcombo -p com.gpn.azs -O /tmp/gpn -vv >/tmp/gpn-download.log 2>&1 || true
          echo '=== DOWNLOAD ==='
          cat /tmp/gpn-download.log | tail -100
          find /tmp/gpn -type f -printf '%p %s bytes\n'
          rm -rf /tmp/u && mkdir /tmp/u
          while IFS= read -r -d '' f; do d="/tmp/u/$(basename "$f")"; mkdir -p "$d"; unzip -q "$f" -d "$d" 2>/dev/null || cp "$f" "$d/base.apk"; done < <(find /tmp/gpn -type f -print0)
          while IFS= read -r -d '' apk; do d="${apk}.u"; mkdir -p "$d"; unzip -q "$apk" -d "$d" 2>/dev/null || true; done < <(find /tmp/u -type f -name '*.apk' -print0)
          find /tmp/u -type f -print0 | xargs -0 -r strings -a 2>/dev/null > /tmp/all.txt || true
          echo '=== URLS ==='
          grep -Eaio 'https?://[^[:space:]"<>]+' /tmp/all.txt | grep -Eai 'gpn|gazprom|azs|fuel|station|api|bonus|refuel' | sort -u | head -700 || true
          echo '=== HOSTS/PATHS ==='
          grep -Eai 'gpn|gazprom|gpnbonus|fuel|station|azs|petrol|gasoline|availability|available|assortment|refuel|terminal|price|остат|налич|топлив|заправ' /tmp/all.txt | sort -u | head -1600 || true
