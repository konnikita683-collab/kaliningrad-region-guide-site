name: PB5.1 Android smoke
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "beta092pb51/**"
      - ".github/workflows/pb51-smoke.yml"
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - run: python3 -m http.server 8000 >/tmp/http.log 2>&1 &
      - run: |
          node <<'NODE'
          const{chromium}=require('playwright');
          (async()=>{let b;try{
            b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:412,height:915},deviceScaleFactor:2.625,isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (Linux; Android 15; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Mobile Safari/537.36',locale:'ru-RU'});
            await p.route('https://api.open-meteo.com/**',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({daily:{time:['2026-08-24','2026-08-25','2026-08-26','2026-08-27','2026-08-28'],weather_code:[1,2,1,3,2],temperature_2m_max:[24,23,25,22,21],temperature_2m_min:[18,17,19,16,15],precipitation_probability_max:[10,20,15,35,25]}})}));
            await p.route('https://marine-api.open-meteo.com/**',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({hourly:{time:['2026-08-24T12:00','2026-08-25T12:00','2026-08-26T12:00','2026-08-27T12:00','2026-08-28T12:00'],sea_surface_temperature:[19.1,19.0,18.9,18.7,18.5],wave_height:[0.4,0.5,0.6,0.5,0.4]}})}));
            await p.goto('http://127.0.0.1:8000/beta092pb51/?ci=android',{waitUntil:'networkidle'});await p.waitForSelector('#wizard',{timeout:15000});
            const body=await p.locator('body').innerText();if(!body.includes('BETA 0.9.2 PB5.1'))throw new Error('PB5.1 badge missing');
            await p.locator('#a').fill('2026-08-24');await p.locator('#b').fill('2026-08-28');await p.locator('#next').click();await p.locator('#ad').fill('2');await p.locator('#ch').fill('2');await p.waitForTimeout(150);await p.locator('[data-child-age="0"]').selectOption('10');await p.locator('[data-child-age="1"]').selectOption('13');await p.locator('#next').click();await p.locator('button[data-g="city"][data-v="Зеленоградск"]').click();
            await p.evaluate(()=>{st.car='maybe';st.carDays=2;st.interests=['sea','nature'];build();});await p.waitForTimeout(2200);
            const days=p.locator('#planList .day');if(await days.count()!==5)throw new Error('Route != 5');
            if(await p.locator('#planList .guide-day-excursion').count()!==5)throw new Error('Natural excursion recommendations missing');
            for(let i=0;i<5;i++){const d=days.nth(i);if(await d.locator('.guide-day-excursion').count()!==1)throw new Error('excursion count day '+i);if(await d.locator('.guide-day-notes').count()!==1)throw new Error('notes missing day '+i);if(await d.locator('.guide-live-weather').count()!==1)throw new Error('weather missing day '+i);const href=await d.locator('[data-tripster-catalog]').getAttribute('href');if(!/^https:\/\/experience\.tripster\.ru\//.test(href||''))throw new Error('Tripster link missing day '+i);}
            await p.evaluate(()=>{window.currentPlan[2].id='curonian';window.guideRefreshDayTools();});await p.waitForTimeout(180);let href=await days.nth(2).locator('[data-tripster-catalog]').getAttribute('href');if(!/4729-kurshskaya-kosa/.test(href||''))throw new Error('Curonian mapping failed '+href);
            await p.evaluate(()=>{window.currentPlan[2].id='kal-classic';window.guideRefreshDayTools();});await p.waitForTimeout(180);href=await days.nth(2).locator('[data-tripster-catalog]').getAttribute('href');if(href!=='https://experience.tripster.ru/experience/Kaliningrad/')throw new Error('Kaliningrad mapping failed '+href);
            console.log('PB5.1 PASS: route=5 excursions=5 notes=5 weather=5 dynamic_mapping=PASS');
          }finally{if(b)await b.close();}})().catch(e=>{console.error(e);process.exit(1)});
          NODE