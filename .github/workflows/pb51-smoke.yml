name: PB5.2 Android replacement smoke
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "beta092pb52/**"
      - ".github/workflows/pb51-smoke.yml"
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - run: python3 -m http.server 8000 >/tmp/http.log 2>&1 &
      - run: |
          node <<'NODE'
          const{chromium}=require('playwright');
          (async()=>{let b;try{
            b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:412,height:915},deviceScaleFactor:2.625,isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (Linux; Android 15; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Mobile Safari/537.36',locale:'ru-RU'});
            await p.route('https://api.open-meteo.com/**',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({daily:{time:['2026-08-25','2026-08-26','2026-08-27','2026-08-28','2026-08-29'],weather_code:[1,2,1,3,2],temperature_2m_max:[24,23,25,22,21],temperature_2m_min:[18,17,19,16,15],precipitation_probability_max:[10,20,15,35,25]}})}));
            await p.route('https://marine-api.open-meteo.com/**',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({hourly:{time:['2026-08-25T12:00','2026-08-26T12:00','2026-08-27T12:00','2026-08-28T12:00','2026-08-29T12:00'],sea_surface_temperature:[19.1,19.0,18.9,18.7,18.5],wave_height:[0.4,0.5,0.6,0.5,0.4]}})}));
            await p.goto('http://127.0.0.1:8000/beta092pb52/?ci=android',{waitUntil:'networkidle'});await p.waitForSelector('#wizard',{timeout:15000});
            if(!(await p.locator('body').innerText()).includes('BETA 0.9.2 PB5.2'))throw new Error('PB5.2 badge missing');
            await p.locator('#a').fill('2026-08-25');await p.locator('#b').fill('2026-08-29');await p.locator('#next').click();await p.locator('#ad').fill('2');await p.locator('#ch').fill('2');await p.waitForTimeout(150);await p.locator('[data-child-age="0"]').selectOption('10');await p.locator('[data-child-age="1"]').selectOption('13');await p.locator('#next').click();await p.locator('button[data-g="city"][data-v="Зеленоградск"]').click();
            await p.evaluate(()=>{st.car='maybe';st.carDays=2;st.interests=['sea','nature'];build();});
            await p.waitForFunction(()=>document.querySelectorAll('.day').length===5,{timeout:6000});
            let d=p.locator('.day').nth(3);await d.locator('.day-toggle').click();
            await d.locator('.tools select').selectOption({label:'Амалиенау, проспект Мира и зоопарк'});await d.locator('.tools button').click();
            await p.waitForFunction(()=>{const d=document.querySelector('.day[data-i="3"]');return d&&/Амалиенау/.test(d.querySelector('.day-head h3')?.textContent||'')&&/Скрыть/.test(d.querySelector('.day-toggle')?.textContent||'')&&d.querySelector('.guide-day-excursion');},{timeout:4000});
            d=p.locator('.day[data-i="3"]');let text=await d.innerText();let href=await d.locator('[data-tripster-catalog]').getAttribute('href');
            if(!/День 4 · Калининград/.test(text))throw new Error('Kaliningrad day label not corrected');
            if(!/Калининград · Проспект Мира/i.test(text))throw new Error('Kaliningrad evening location ambiguous');
            if(href!=='https://experience.tripster.ru/experience/Kaliningrad/')throw new Error('Kaliningrad excursion link wrong '+href);
            await d.locator('.tools select').selectOption({label:'Янтарный: пляж, парк Беккера и янтарная история'});await d.locator('.tools button').click();
            await p.waitForFunction(()=>{const d=document.querySelector('.day[data-i="3"]');return d&&/Янтарный/.test(d.querySelector('.day-head h3')?.textContent||'')&&/Скрыть/.test(d.querySelector('.day-toggle')?.textContent||'')&&d.querySelector('.guide-day-excursion');},{timeout:4000});
            d=p.locator('.day[data-i="3"]');text=await d.innerText();href=await d.locator('[data-tripster-catalog]').getAttribute('href');
            if(!/День 4 · Янтарный/.test(text))throw new Error('Yantarny day label not corrected');
            if(!/Экскурсии в Янтарный/.test(text))throw new Error('Yantarny excursion recommendation missing');
            if(!/74582-v-baltijsk-yantarnyj-svetlogorsk/.test(href||''))throw new Error('Yantarny excursion link wrong '+href);
            const first=p.locator('.day').nth(0),firstText=await first.innerText();if(/приезд|заселен|аэропорт|первый вечер/i.test(firstText)&&await first.locator('.guide-day-excursion').count()!==0)throw new Error('Arrival day must not push excursion');
            const legacy=await p.locator('.event-recommendation').count();if(legacy){const visible=await p.locator('.event-recommendation:visible').count();if(!visible)throw new Error('Original museum/object recommendations are hidden');}
            console.log('PB5.2 PASS: real replace Amalienau + Yantarny, coherent labels, open details, excursions, arrival rule');
          }finally{if(b)await b.close();}})().catch(e=>{console.error(e);process.exit(1)});
          NODE