name: Ostrovok URL discovery

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/ostrovok-discovery.yml"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify live Ostrovok dated URL
        run: |
          mkdir -p status
          node <<'NODE'
          const fs=require('fs'); const {chromium}=require('playwright');
          (async()=>{let b,p;try{
            b=await chromium.launch({headless:true});
            p=await b.newPage({viewport:{width:412,height:915},locale:'ru-RU'});
            const target='https://ostrovok.ru/hotel/russia/zelenogradsk/?q=6135696&dates=24.08.2026-28.08.2026&guests=2&search=yes';
            const resp=await p.goto(target,{waitUntil:'domcontentloaded',timeout:60000});
            await p.waitForTimeout(6000);
            const body=(await p.locator('body').innerText()).slice(0,5000);
            const title=await p.title();
            const url=p.url();
            const is404=/ошибка\s*404|страница не найдена|error\s*404/i.test(body+' '+title);
            const hasDates=/24\s*(?:авг|августа).{0,80}28\s*(?:авг|августа)/is.test(body) || /24\.08\.2026/.test(body) || /28\.08\.2026/.test(body);
            const noDates=/даты не выбраны|выберите даты/i.test(body);
            fs.writeFileSync('status/ostrovok-discovery.txt','status='+(is404?'FAIL404':'OK')+'\nhttp='+(resp?resp.status():'none')+'\nurl='+url+'\ntitle='+title.replace(/\n/g,' ')+'\nhas_dates='+hasDates+'\nno_dates='+noDates+'\nbody='+body.replace(/\n/g,' | ')+'\n');
            if(is404||!hasDates||noDates)process.exitCode=1;
          }catch(e){fs.writeFileSync('status/ostrovok-discovery.txt','status=FAIL\nerror='+String(e&&e.message||e)+'\n');process.exitCode=1;}finally{if(b)await b.close();}})();
          NODE
      - name: Persist result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/ostrovok-discovery.txt
          git commit -m "Record Ostrovok dated URL verification [skip ci]" || true
          git push
