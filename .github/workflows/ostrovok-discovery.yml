name: Ostrovok URL discovery

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/ostrovok-discovery.yml"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Discover region IDs
        run: |
          mkdir -p status
          node <<'NODE'
          const fs=require('fs'); const {chromium}=require('playwright');
          const defs=[['Калининград',['kaliningrad']],['Зеленоградск',['zelenogradsk']],['Светлогорск',['svetlogorsk']],['Пионерский',['pionerskiy','pionersky']],['Янтарный',['yantarny','yantarnyi']],['Балтийск',['baltiysk','baltiisk']],['Гусев',['gusev']]];
          (async()=>{let b;try{b=await chromium.launch({headless:true});const out={};for(const [name,cands] of defs){let found=null;for(const slug of cands){const p=await b.newPage({locale:'ru-RU'});try{const resp=await p.goto('https://ostrovok.ru/hotel/russia/'+slug+'/',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(1800);const html=await p.content();const body=(await p.locator('body').innerText()).slice(0,900);let m=html.match(new RegExp('name\\\\":\\\\"'+name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\\\"[^]{0,500}?regionId\\\\":(\\d+)'));if(!m)m=html.match(new RegExp('name\\":\\"'+name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\"[^]{0,500}?regionId\\":(\\d+)'));if(!m)m=html.match(/currentRegionData[^]{0,1000}?regionId(?:\\?"|&quot;)?\s*[:=]\s*(\d+)/i);if(m&&!/ошибка\s*404|страница не найдена/i.test(body)){found={slug,regionId:m[1],http:resp?resp.status():null};await p.close();break;}}catch(e){}await p.close();}out[name]=found;}fs.writeFileSync('status/ostrovok-discovery.txt','status=OK\n'+JSON.stringify(out,null,2)+'\n');if(Object.values(out).some(x=>!x))process.exitCode=1;}catch(e){fs.writeFileSync('status/ostrovok-discovery.txt','status=FAIL\nerror='+String(e&&e.message||e)+'\n');process.exitCode=1;}finally{if(b)await b.close();}})();
          NODE
      - name: Persist result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/ostrovok-discovery.txt
          git commit -m "Record compact Ostrovok city IDs [skip ci]" || true
          git push
