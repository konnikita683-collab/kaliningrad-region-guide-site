name: GdeBenz Network Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gdebenz-network-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Extract GdeBenz live status API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gdeprobe && cd /tmp/gdeprobe
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          cat > probe.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({locale:'ru-RU',timezoneId:'Europe/Moscow',viewport:{width:1280,height:900},userAgent:'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'});
          const page=await context.newPage();
          await page.goto('https://gdebenz.ru/sankt-peterburg',{waitUntil:'domcontentloaded',timeout:90000});
          await page.waitForTimeout(5000);
          const result=await page.evaluate(async()=>{
            async function j(path){const r=await fetch('https://api.gdebenz.ru'+path); return {status:r.status, body: await r.json().catch(async()=>({text:await r.text()}))};}
            const bbox=await j('/api/v1/stations/bbox?min_lat=59.80&max_lat=59.95&min_lon=30.25&max_lon=30.60&limit=500');
            const arr=bbox.body.items||bbox.body.stations||bbox.body||[];
            const stations=Array.isArray(arr)?arr:[];
            const c={lat:59.8775,lon:30.4390};
            const rad=x=>x*Math.PI/180;
            const dist=s=>{const R=6371,a=rad(s.lat),b=rad(c.lat),dlat=rad(c.lat-s.lat),dlon=rad(c.lon-(s.lon??s.lng)); const h=Math.sin(dlat/2)**2+Math.cos(a)*Math.cos(b)*Math.sin(dlon/2)**2; return 2*R*Math.asin(Math.sqrt(h));};
            const nearest=stations.map(s=>({...s,_km:dist(s)})).sort((a,b)=>a._km-b._km).slice(0,25);
            const ids=nearest.map(s=>s.id).join(',');
            const stats= ids ? await j('/api/v1/reports/grade-stats?station_ids='+encodeURIComponent(ids)) : null;
            const first=nearest[0];
            const guesses=[];
            if(first){for(const p of [`/api/v1/stations/${first.id}`,`/api/v1/reports?station_id=${first.id}`,`/api/v1/stations/${first.id}/reports`,`/api/v1/reports/latest?station_id=${first.id}`]){try{const x=await j(p); guesses.push({path:p,status:x.status,body:x.body});}catch(e){guesses.push({path:p,error:String(e)})}}}
            return {bbox_status:bbox.status,count:stations.length,nearest,grade_stats:stats,detail_guesses:guesses};
          });
          console.log(JSON.stringify(result,null,2));
          await browser.close();
          JS
          node probe.mjs
