name: Yandex Fuel Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yandex-fuel-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Trace Yandex road-events request construction
        shell: bash
        run: |
          set -u
          set +o pipefail
          git clone -q https://github.com/kiber-io/apkdgo.git /tmp/apkdgo
          cd /tmp/apkdgo && go build -o /tmp/apkd ./apkd
          mkdir -p /tmp/pkg
          /tmp/apkd -s apkcombo -p ru.yandex.yandexmaps -O /tmp/pkg >/tmp/download.log 2>&1 || true
          rm -rf /tmp/unpack && mkdir /tmp/unpack
          while IFS= read -r -d '' f; do
            d="/tmp/unpack/$(basename "$f")"; mkdir -p "$d"; unzip -q "$f" -d "$d" 2>/dev/null || cp "$f" "$d/base.apk"
          done < <(find /tmp/pkg -type f -print0)
          while IFS= read -r -d '' apk; do
            d="${apk}.u"; mkdir -p "$d"; unzip -q "$apk" -d "$d" 2>/dev/null || true
          done < <(find /tmp/unpack -type f -name '*.apk' -print0)
          LIB=$(find /tmp/unpack -type f -name 'libmaps-mobile.so' -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          echo '=== PACKAGE / LIB ==='
          grep -E 'ru\.yandex\.yandexmaps v' /tmp/download.log | tail -1 || true
          echo "$LIB"; ls -lh "$LIB"
          strings -a -t x "$LIB" > /tmp/lm.txt

          echo '=== EXACT PATH/HOST STRING OFFSETS ==='
          grep -Ei '(/user_events|/feedback|/comments|/comment|/events|proxy\.mob\.maps\.yandex\.net|road_events)' /tmp/lm.txt | head -500 || true

          echo '=== LOCAL STRING NEIGHBORHOODS ==='
          python3 - "$LIB" <<'PY'
          import re, sys
          p=sys.argv[1]
          b=open(p,'rb').read()
          needles=[b'/user_events',b'/feedback',b'/comments',b'proxy.mob.maps.yandex.net',b'RoadEventsManagerImpl',b'createRoadEventsRequestFactory']
          for n in needles:
              print('\n---',n.decode(errors='replace'),'---')
              start=0
              found=0
              while True:
                  i=b.find(n,start)
                  if i<0: break
                  found+=1
                  lo=max(0,i-4096); hi=min(len(b),i+len(n)+4096)
                  chunk=b[lo:hi]
                  ss=[]
                  for m in re.finditer(rb'[ -~]{4,}',chunk):
                      s=m.group().decode('utf-8','replace')
                      off=lo+m.start()
                      if any(k.lower() in s.lower() for k in ['http','event','comment','feed','proxy','road','user_','feedback','request','response','url','path','host','auth','token','clid','uuid','locale','lang']):
                          ss.append((off,s[:500]))
                  print(f'offset=0x{i:x}')
                  for off,s in ss[:160]: print(f'  0x{off:x} {s}')
                  start=i+1
                  if found>=5: break
          PY

          echo '=== SYMBOLS ==='
          (nm -C "$LIB" 2>/dev/null || true) | grep -Ei 'RoadEventsManagerImpl|createRoadEventsRequestFactory|road_events_layer::DataSource|requestEventInfo|comments\(' | head -240 || true
          (nm -D -C "$LIB" 2>/dev/null || true) | grep -Ei 'RoadEventsManagerImpl|createRoadEventsRequestFactory|road_events_layer::DataSource|requestEventInfo|comments\(' | head -240 || true
          (readelf -Ws "$LIB" 2>/dev/null | c++filt || true) | grep -Ei 'RoadEventsManagerImpl|createRoadEventsRequestFactory|road_events_layer::DataSource|requestEventInfo|comments\(' | head -240 || true

          echo '=== HTTP / REQUEST LOG STRINGS ==='
          grep -Eai 'GET /|POST /|PUT /|DELETE /|request duration|HTTP/[0-9]|Content-Type|Authorization|X-[A-Za-z-]+|clid|uuid|device[_-]?id|session|token' /tmp/lm.txt | \
            grep -Eai 'road|event|comment|user|feedback|proxy|mapkit|http|request|content|auth|clid|uuid|device|session|token' | head -500 || true

          echo '=== PROTO / CONFIG FIELD-LIKE STRINGS ==='
          grep -Ein -C 12 'mobile_config\.mapkit2\.roadevents\.Config|proto\.road_events\.(UserEvents|UserEvent|RoadEventMetadata|TextEntry|LayerRoadEventMetadata)' /tmp/lm.txt | head -600 || true
