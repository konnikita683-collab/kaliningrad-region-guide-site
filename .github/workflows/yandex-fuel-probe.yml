name: Yandex Fuel Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yandex-fuel-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Inspect libmaps-mobile road-event transport context
        shell: bash
        run: |
          set -u
          set +o pipefail
          git clone -q https://github.com/kiber-io/apkdgo.git /tmp/apkdgo
          cd /tmp/apkdgo && go build -o /tmp/apkd ./apkd
          mkdir -p /tmp/pkg
          /tmp/apkd -s apkcombo -p ru.yandex.yandexmaps -O /tmp/pkg >/tmp/download.log 2>&1 || true
          rm -rf /tmp/unpack && mkdir /tmp/unpack
          while IFS= read -r -d '' f; do
            d="/tmp/unpack/$(basename "$f")"; mkdir -p "$d"; unzip -q "$f" -d "$d" 2>/dev/null || cp "$f" "$d/base.apk"
          done < <(find /tmp/pkg -type f -print0)
          while IFS= read -r -d '' apk; do
            d="${apk}.u"; mkdir -p "$d"; unzip -q "$apk" -d "$d" 2>/dev/null || true
          done < <(find /tmp/unpack -type f -name '*.apk' -print0)
          LIB=$(find /tmp/unpack -type f -name 'libmaps-mobile.so' -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          echo '=== PACKAGE / LIB ==='
          grep -E 'ru\.yandex\.yandexmaps v' /tmp/download.log | tail -1 || true
          echo "$LIB"; ls -lh "$LIB"
          strings -a -t x "$LIB" > /tmp/lm.txt
          echo '=== ROAD EVENT STRING CONTEXT ==='
          grep -Ein -C 5 'road[_ /.-]?events?|roadevents|requestEventInfo|EventInfoSession|FeedSession|RoadEventsManager|RoadEventsLayer|PendingComments|roadEventId' /tmp/lm.txt | head -320 || true
          echo '=== URL/PATH CANDIDATES ==='
          grep -Eai 'https?://|/[A-Za-z0-9._/-]*(road|event|comment|ugc|feed|traffic|jam)[A-Za-z0-9._/?=&-]*' /tmp/lm.txt | \
            grep -Eai 'map|road|event|comment|ugc|feed|traffic|jam|proxy' | sort -u | head -260 || true
          echo '=== PROXY CONTEXT ==='
          grep -Ein -C 8 'proxy\.mob\.maps|geointernal\.mob\.maps|ugcpub|mapkit2' /tmp/lm.txt | head -300 || true
          echo '=== NETWORK TOKENS ==='
          grep -Eai 'road_events|roadevents|event_info|eventinfo|comments|feed|entry' /tmp/lm.txt | \
            grep -Eai 'proto|http|request|response|url|path|host|service|client|server|api' | sort -u | head -260 || true
