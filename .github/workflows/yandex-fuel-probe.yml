name: Yandex Fuel Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yandex-fuel-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Inspect road-event endpoints and layer configuration
        shell: bash
        run: |
          set -u
          set +o pipefail
          git clone -q https://github.com/kiber-io/apkdgo.git /tmp/apkdgo
          cd /tmp/apkdgo && go build -o /tmp/apkd ./apkd
          mkdir -p /tmp/pkg
          /tmp/apkd -s apkcombo -p ru.yandex.yandexmaps -O /tmp/pkg >/tmp/download.log 2>&1 || true
          rm -rf /tmp/unpack && mkdir /tmp/unpack
          while IFS= read -r -d '' f; do
            d="/tmp/unpack/$(basename "$f")"; mkdir -p "$d"; unzip -q "$f" -d "$d" 2>/dev/null || cp "$f" "$d/base.apk"
          done < <(find /tmp/pkg -type f -print0)
          while IFS= read -r -d '' apk; do
            d="${apk}.u"; mkdir -p "$d"; unzip -q "$apk" -d "$d" 2>/dev/null || true
          done < <(find /tmp/unpack -type f -name '*.apk' -print0)
          LIB=$(find /tmp/unpack -type f -name 'libmaps-mobile.so' -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          echo '=== PACKAGE ==='; grep -E 'ru\.yandex\.yandexmaps v' /tmp/download.log | tail -1 || true
          echo "LIB=$LIB"

          echo '=== ENDPOINT-LIKE STRINGS ==='
          strings -a -t x "$LIB" | grep -Eai 'comments/(list|add)|/user_events|/feedback|road.?events.*url|url.*road.?events|roadevents.*url|proxy\.mob\.maps\.yandex\.net|event[_-]?id|comments_count' | head -1200 || true

          echo '=== ASCII NEIGHBORHOODS ==='
          python3 - "$LIB" <<'PY'
          import re,sys
          b=open(sys.argv[1],'rb').read()
          needles=[b'comments/list',b'comments/add',b'/user_events',b'Road events layer url: ',b'https://proxy.mob.maps.yandex.net:443']
          for n in needles:
              print('\n###',n.decode(errors='replace'))
              pos=0
              while True:
                  i=b.find(n,pos)
                  if i<0: break
                  lo=max(0,i-8192); hi=min(len(b),i+8192)
                  arr=[]
                  for m in re.finditer(rb'[\x20-\x7e]{3,}',b[lo:hi]):
                      s=m.group().decode('utf-8','replace')
                      off=lo+m.start()
                      if abs(off-i)<2500 or any(x in s.lower() for x in ['comment','event','road','feed','http','url','proxy','user_','feedback','layer','version','tile','bbox','clid','lang','locale','zoom']):
                          arr.append((off,s[:700]))
                  print(f'offset=0x{i:x}')
                  for off,s in arr[:260]: print(f'0x{off:x}\t{s}')
                  pos=i+1

          print('\n=== SLASH PATH CLUSTER AROUND ROAD EVENTS TU ===')
          for m in re.finditer(rb'[\x20-\x7e]{3,}',b):
              s=m.group().decode('utf-8','replace')
              off=m.start()
              if 0x545000 <= off <= 0x548000 and ('/' in s or 'url' in s.lower() or 'comment' in s.lower() or 'event' in s.lower() or 'feed' in s.lower()):
                  print(f'0x{off:x}\t{s[:1000]}')
          PY

          echo '=== CONFIG FIELD CANDIDATES ==='
          strings -a "$LIB" | grep -Eai 'user.?events|road.?events|tile.?url|url.?template|dynamic.?version|update.?period|comments/(list|add)|feed' | head -1000 || true
