name: Yandex Fuel Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yandex-fuel-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download Yandex Maps from RuStore and inspect strings
        shell: bash
        run: |
          set -u
          git clone -q https://github.com/avoidcode/rustoredl.git /tmp/rustoredl
          python3 -m pip install -q /tmp/rustoredl
          mkdir -p /tmp/yandexpkg && cd /tmp/yandexpkg
          echo '--- RUSTORE DOWNLOAD ---'
          rustoredl download -p ru.yandex.yandexmaps || true
          echo '--- DOWNLOADED FILES ---'
          ls -lah
          rm -rf unpack && mkdir unpack
          for f in ru.yandex.yandexmaps.*; do
            [ -f "$f" ] || continue
            d="unpack/$(basename "$f")"; mkdir -p "$d"
            unzip -q "$f" -d "$d" 2>/dev/null || cp "$f" "$d/base.apk"
            find "$d" -type f -name '*.apk' -print0 | while IFS= read -r -d '' apk; do
              ad="${apk}.dir"; mkdir -p "$ad"; unzip -q "$apk" -d "$ad" 2>/dev/null || true
            done
          done
          echo '--- INTERESTING URLS ---'
          find unpack -type f -print0 | xargs -0 -r strings -a 2>/dev/null | \
            grep -Eaio 'https?://[^[:space:]"<>]+' | \
            grep -Eai 'yandex|traffic|event|fuel|petrol|gas|station|refuel|queue|jam|trf|trfe|conversation|comment|talk' | \
            sort -u | head -1200 || true
          echo '--- KEYWORD STRINGS ---'
          find unpack -type f -print0 | xargs -0 -r strings -a 2>/dev/null | \
            grep -Eai 'traffic.?event|road.?event|conversation|razgov|fuel.?availability|fuel.?station|gas.?station|refuel|petrol|queue|trfe|mtrproxy|jams\.maps|availability' | \
            sort -u | head -1800 || true
