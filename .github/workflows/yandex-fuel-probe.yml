name: Yandex Fuel Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yandex-fuel-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Probe documented read-only infopoints endpoints
        shell: bash
        run: |
          set -u
          set +o pipefail
          echo '=== DNS ==='
          getent ahosts infopoints.maps.yandex.net || true
          getent ahosts proxy.mob.maps.yandex.net || true

          echo '=== READ-ONLY HTTP PROBES WITH NONEXISTENT IDS ==='
          for u in \
            'https://infopoints.maps.yandex.net/events/get?id=__fuel_probe_nonexistent__' \
            'https://infopoints.maps.yandex.net/comments/list?event_id=__fuel_probe_nonexistent__' \
            'http://infopoints.maps.yandex.net/events/get?id=__fuel_probe_nonexistent__' \
            'http://infopoints.maps.yandex.net/comments/list?event_id=__fuel_probe_nonexistent__'; do
            echo "--- $u"
            curl -L --max-time 20 -sS -D /tmp/h -o /tmp/b -w 'HTTP=%{http_code} IP=%{remote_ip} URL=%{url_effective}\n' \
              -A 'Mozilla/5.0 (Linux; Android 16) YandexMaps/30.8.1' \
              -H 'Accept: */*' "$u" || true
            sed -n '1,30p' /tmp/h || true
            echo 'BODY:'; head -c 3000 /tmp/b || true; echo
          done

          echo '=== DOWNLOAD CURRENT YANDEX MAPS ==='
          git clone -q https://github.com/kiber-io/apkdgo.git /tmp/apkdgo
          cd /tmp/apkdgo && go build -o /tmp/apkd ./apkd
          mkdir -p /tmp/pkg
          /tmp/apkd -s apkcombo -p ru.yandex.yandexmaps -O /tmp/pkg >/tmp/download.log 2>&1 || true
          grep -E 'ru\.yandex\.yandexmaps v' /tmp/download.log | tail -1 || true
          rm -rf /tmp/unpack && mkdir /tmp/unpack
          while IFS= read -r -d '' f; do
            d="/tmp/unpack/$(basename "$f")"; mkdir -p "$d"; unzip -q "$f" -d "$d" 2>/dev/null || cp "$f" "$d/base.apk"
          done < <(find /tmp/pkg -type f -print0)
          while IFS= read -r -d '' apk; do
            d="${apk}.u"; mkdir -p "$d"; unzip -q "$apk" -d "$d" 2>/dev/null || true
          done < <(find /tmp/unpack -type f -name '*.apk' -print0)
          LIB=$(find /tmp/unpack -type f -name 'libmaps-mobile.so' -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          echo "LIB=$LIB"

          echo '=== ALL INFOPOINT/ROAD-EVENT HOST/PATH STRINGS ==='
          strings -a -t x "$LIB" | grep -Eai 'infopoint|comments/list|comments/add|events/get|events/list|/user_events|proxy\.mob\.maps\.yandex|jams.*yandex|road.?events.*(host|url|path)|/(road|event|comment)[a-z0-9_./?-]*' | head -2500 || true

          echo '=== NEIGHBORHOODS OF READ ENDPOINTS ==='
          python3 - "$LIB" <<'PY'
          import re,sys
          b=open(sys.argv[1],'rb').read()
          for n in [b'comments/list',b'events/get',b'events/list',b'infopoints.maps.yandex.net',b'proxy.mob.maps.yandex.net']:
            print('\n###',n.decode(errors='replace'))
            p=0
            while True:
              i=b.find(n,p)
              if i<0: break
              print('offset',hex(i))
              lo=max(0,i-6000); hi=min(len(b),i+6000)
              for m in re.finditer(rb'[\x20-\x7e]{3,}',b[lo:hi]):
                s=m.group().decode('utf-8','replace'); off=lo+m.start()
                if abs(off-i)<1800 or any(k in s.lower() for k in ['http','host','path','proxy','event','comment','feed','url','clid','uuid','lang','locale','infopoint']):
                  print(hex(off),s[:600])
              p=i+1
          PY
