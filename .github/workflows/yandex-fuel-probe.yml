name: Yandex Fuel Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yandex-fuel-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Download Yandex Maps with current apkdgo and inspect strings
        shell: bash
        run: |
          set -u
          git clone -q https://github.com/kiber-io/apkdgo.git /tmp/apkdgo
          cd /tmp/apkdgo
          go build -o /tmp/apkd ./cmd/apkd 2>/dev/null || go build -o /tmp/apkd .
          mkdir -p /tmp/yandexpkg
          echo '--- APKD DOWNLOAD ---'
          /tmp/apkd -s rustore -p ru.yandex.yandexmaps -O /tmp/yandexpkg -vv || true
          echo '--- DOWNLOADED FILES ---'
          find /tmp/yandexpkg -maxdepth 2 -type f -printf '%p %s bytes\n' | head -100
          rm -rf /tmp/yunpack && mkdir /tmp/yunpack
          i=0
          find /tmp/yandexpkg -type f -print0 | while IFS= read -r -d '' f; do
            i=$((i+1)); d="/tmp/yunpack/p$i"; mkdir -p "$d"
            unzip -q "$f" -d "$d" 2>/dev/null || cp "$f" "$d/base.apk"
            find "$d" -type f -name '*.apk' -print0 | while IFS= read -r -d '' apk; do
              ad="${apk}.dir"; mkdir -p "$ad"; unzip -q "$apk" -d "$ad" 2>/dev/null || true
            done
          done
          echo '--- INTERESTING URLS ---'
          find /tmp/yunpack -type f -print0 | xargs -0 -r strings -a 2>/dev/null | \
            grep -Eaio 'https?://[^[:space:]"<>]+' | \
            grep -Eai 'yandex|traffic|event|fuel|petrol|gas|station|refuel|queue|jam|trf|trfe|conversation|comment|talk' | \
            sort -u | head -1500 || true
          echo '--- KEYWORD STRINGS ---'
          find /tmp/yunpack -type f -print0 | xargs -0 -r strings -a 2>/dev/null | \
            grep -Eai 'traffic.?event|road.?event|conversation|razgov|fuel.?availability|fuel.?station|gas.?station|refuel|petrol|queue|trfe|mtrproxy|jams\.maps|availability' | \
            sort -u | head -2200 || true
