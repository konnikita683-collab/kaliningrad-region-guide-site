name: Yandex Fuel Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yandex-fuel-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download current Yandex Maps package and inspect endpoint strings
        shell: bash
        run: |
          set -u
          URL='https://d.apkpure.com/b/XAPK/ru.yandex.yandexmaps?version=latest'
          echo "Testing $URL"
          HTTP_CODE=$(curl -L --max-time 300 --retry 2 -sS \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36' \
            -D headers.txt -o app.xapk -w '%{http_code}' "$URL" || true)
          echo "HTTP_CODE=$HTTP_CODE"
          echo "SIZE=$(wc -c < app.xapk 2>/dev/null || echo 0)"
          grep -iE '^(content-type|content-length|location):' headers.txt | tail -20 || true
          file app.xapk || true
          if [ "$HTTP_CODE" != "200" ]; then
            echo 'DOWNLOAD_FAILED'
            head -c 1000 app.xapk || true
            exit 0
          fi
          rm -rf unpack && mkdir unpack
          unzip -q app.xapk -d unpack || cp app.xapk unpack/base.apk
          echo '--- PACKAGE FILES ---'
          find unpack -maxdepth 2 -type f | head -100
          echo '--- INTERESTING HOST/URL STRINGS ---'
          find unpack -type f \( -name '*.apk' -o -name '*.dex' -o -name '*.so' -o -name '*.json' -o -name '*.txt' \) -print0 | \
            xargs -0 -r strings -a 2>/dev/null | \
            grep -Eai 'https?://[^[:space:]"<>]+|[a-z0-9.-]+\.yandex\.(ru|net|com)[^[:space:]"<>]*' | \
            grep -Eai 'jam|traffic|event|talk|conversation|comment|fuel|petrol|gas|station|azs|refuel|availability|queue|trf|trfe' | \
            sort -u | head -600 || true
          echo '--- KEYWORD CONTEXT STRINGS ---'
          find unpack -type f \( -name '*.apk' -o -name '*.dex' -o -name '*.so' \) -print0 | \
            xargs -0 -r strings -a 2>/dev/null | \
            grep -Eai 'traffic.?event|road.?event|conversation|razgov|разговор|fuel.?availability|fuel.?station|gas.?station|refuel|petrol|очеред|топлив|бензин|trfe|mtrproxy' | \
            sort -u | head -800 || true
