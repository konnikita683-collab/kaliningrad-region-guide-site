name: Fuel Live Data Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yandex-fuel-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@latest >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Probe 2GIS live fuel status network
        shell: bash
        run: |
          cat > /tmp/probe.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true, args:['--no-sandbox','--disable-dev-shm-usage']});
          const context = await browser.newContext({locale:'ru-RU', timezoneId:'Europe/Moscow', userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36', viewport:{width:1440,height:1000}});
          const page = await context.newPage();
          const logs=[]; const seen=new Set();
          page.on('response', async r => {
            try {
              const req=r.request(), u=r.url(), rt=req.resourceType();
              const headers=await r.allHeaders(); const ct=headers['content-type']||'';
              if (!(rt==='xhr'||rt==='fetch'||/json|protobuf|octet-stream/i.test(ct))) return;
              if (seen.has(u)) return; seen.add(u);
              let body=''; try{body=await r.text();}catch{}
              const low=(u+' '+body.slice(0,16000)).toLowerCase();
              if (/fuel|petrol|azs|gas_station|gasstation|station|queue|limit|availability|filling|firm|branch|status/.test(low)) logs.push({status:r.status(),ct,rt,url:u,body:body.slice(0,28000)});
            } catch {}
          });
          await page.goto('https://2gis.ru/spb/firm/5348552838608493',{waitUntil:'domcontentloaded',timeout:90000});
          await page.waitForTimeout(9000);
          console.log('TITLE',await page.title()); console.log('URL',page.url());
          const bodyText=await page.locator('body').innerText().catch(()=> '');
          console.log('STATUS_TAB_PRESENT',/Статус АЗС/i.test(bodyText));
          const tab=page.getByText('Статус АЗС',{exact:true});
          const n=await tab.count().catch(()=>0); console.log('STATUS_TAB_COUNT',n);
          if(n){ await tab.first().click({force:true,timeout:20000}).catch(()=>{}); await page.waitForTimeout(9000); }
          const t=await page.locator('body').innerText().catch(()=> '');
          console.log('LIVE_TEXT_BEGIN');
          for (const line of t.split('\n').map(x=>x.trim()).filter(Boolean).filter(x=>/топлив|очеред|92|95|98|100|лимит|огранич|статус|есть|нет топлива|возможно/i.test(x)).slice(0,160)) console.log(line);
          console.log('LIVE_TEXT_END');
          console.log('NETWORK_MATCHES',logs.length);
          for(const x of logs){ console.log('---RESP---'); console.log(JSON.stringify({status:x.status,ct:x.ct,rt:x.rt,url:x.url})); console.log(x.body.replace(/\0/g,'')); }
          await browser.close();
          JS
          node /tmp/probe.mjs
