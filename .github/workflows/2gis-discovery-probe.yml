name: 2GIS Discovery Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/2gis-discovery-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Discover fuel station list parameters
        shell: bash
        run: |
          set -u
          base='https://benzin.api.2gis.ru/api/v1/stations'
          tests=(
            'min_lat=59.70&max_lat=60.05&min_lng=30.20&max_lng=30.70'
            'minLat=59.70&maxLat=60.05&minLng=30.20&maxLng=30.70'
            'min_lat=59.70&max_lat=60.05&min_lon=30.20&max_lon=30.70'
            'minLat=59.70&maxLat=60.05&minLon=30.20&maxLon=30.70'
            'min_lat=59.70&max_lat=60.05&min_long=30.20&max_long=30.70'
            'south=59.70&north=60.05&west=30.20&east=30.70'
          )
          for q in "${tests[@]}"; do
            echo "=== $q ==="
            curl -sS -w '\nHTTP:%{http_code}\n' "$base?$q" | head -80
          done
          echo '=== BY IDS MULTI ==='
          curl -sS -w '\nHTTP:%{http_code}\n' 'https://benzin.api.2gis.ru/api/v1/stations/by-ids?ids=5348552838608493,70000001031621554' | head -160
