name: Beta 0.9.2 browser smoke

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "beta092/**"
      - ".github/workflows/beta092-smoke.yml"

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: python3 -m http.server 8000 > /tmp/beta-http.log 2>&1 &
      - name: Test DATE2 and OST6
        id: smoke
        continue-on-error: true
        run: |
          mkdir -p status
          node <<'NODE'
          const fs=require('fs'); const {chromium}=require('playwright');
          (async()=>{let b,p;try{
            b=await chromium.launch({headless:true});p=await b.newPage({viewport:{width:412,height:915}});
            await p.goto('http://127.0.0.1:8000/beta092/?ci=ost6',{waitUntil:'networkidle'});await p.waitForSelector('#wizard');await p.waitForTimeout(250);
            const body=await p.locator('body').innerText();
            if(!body.includes('BETA 0.9.2 OST6')||body.includes('OST6 ERROR')||body.includes('DATE2 ERROR'))throw new Error('OST6 runtime not active: '+body.slice(-300));
            await p.locator('#a').fill('2026-08-24');await p.locator('#b').fill('2026-08-28');await p.locator('#next').click();
            await p.waitForSelector('#ad');await p.locator('#next').click();await p.waitForSelector('button[data-g="city"]');
            const initial=await p.locator('button[data-g="city"].sel').count();if(initial!==0)throw new Error('Preselected cities='+initial);
            await p.locator('button[data-g="city"][data-v="Зеленоградск"]').click();await p.waitForTimeout(200);
            const stay=(await p.locator('.ob-lodging-head span').first().textContent()||'').trim();if(!/24\s*авг.*28\s*авг/i.test(stay))throw new Error('DATE2 regression: '+stay);
            await p.locator('button[data-lmode="find"][data-city="Зеленоградск"]').click();await p.waitForTimeout(150);
            const generated=await p.evaluate(()=>window.guideBuildOstrovokUrl('Зеленоградск'));
            const expected='https://ostrovok.ru/hotel/russia/zelenogradsk/?q=6135696&dates=24.08.2026-28.08.2026&guests=2&search=yes';
            if(generated!==expected)throw new Error('Generator wrong: '+generated);
            await p.evaluate(()=>{window.__ostCaptured='';window.__guideNativeOpen=function(u){window.__ostCaptured=String(u||'');return null;};});
            await p.locator('button[data-provider="ostrovok"][data-city="Зеленоградск"]').click();await p.waitForTimeout(120);
            const opened=await p.evaluate(()=>window.__ostCaptured||'');if(opened!==expected)throw new Error('Actual click URL wrong: '+opened);
            fs.writeFileSync('status/beta092-smoke.txt','status=PASS\nsource_sha='+process.env.GITHUB_SHA+'\ninitial_cities=0\nstay='+stay+'\nostrovok='+opened+'\n');
          }catch(e){let diag='';try{diag='\nbody='+(await p.locator('body').innerText()).slice(-1200);}catch(_){}fs.writeFileSync('status/beta092-smoke.txt','status=FAIL\nsource_sha='+process.env.GITHUB_SHA+'\nerror='+String(e&&e.message||e)+diag+'\n');process.exitCode=1;}finally{if(b)await b.close();}})();
          NODE
      - name: Persist result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/beta092-smoke.txt
          git commit -m "Record Beta 0.9.2 OST6 smoke [skip ci]" || true
          git push
      - name: Fail when smoke failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
