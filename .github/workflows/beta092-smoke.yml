name: Beta 0.9.2 browser smoke

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "beta092/**"
      - ".github/workflows/beta092-smoke.yml"

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: python3 -m http.server 8000 > /tmp/beta-http.log 2>&1 &
      - name: Inspect Localrent without touching YT1 logic
        id: smoke
        continue-on-error: true
        run: |
          mkdir -p status
          node <<'NODE'
          const fs=require('fs'); const {chromium}=require('playwright');
          (async()=>{let b,p;try{
            b=await chromium.launch({headless:true});p=await b.newPage({viewport:{width:412,height:915},locale:'ru-RU'});
            await p.goto('http://127.0.0.1:8000/beta092/?ci=localrent-diag',{waitUntil:'networkidle'});await p.waitForSelector('#wizard');await p.waitForTimeout(300);
            let body=await p.locator('body').innerText();if(!body.includes('BETA 0.9.2 YT1'))throw new Error('YT1 not active');
            const globals=await p.evaluate(()=>({renderCar:typeof window.renderCar,st:typeof st!=='undefined'?st:null}));
            if(globals.renderCar!=='function')throw new Error('renderCar unavailable');
            await p.evaluate(()=>{st.start='2026-08-24';st.end='2026-08-28';st.car='yes';renderCar([{car:true},{car:true},{car:false},{car:true}]);});
            await p.waitForTimeout(100);
            const links=await p.locator('a[href*="localrent" i]').evaluateAll(as=>as.map(a=>({href:a.href,text:(a.textContent||'').trim(),cls:a.className})));
            const carText=(await p.locator('#carInfo').innerText()).slice(0,2500);
            fs.writeFileSync('status/beta092-smoke.txt','status=LOCALRENT_DIAG\nsource_sha='+process.env.GITHUB_SHA+'\nlinks='+JSON.stringify(links)+'\ncar='+carText.replace(/\n/g,' | ')+'\n');
            if(!links.length)process.exitCode=1;
          }catch(e){fs.writeFileSync('status/beta092-smoke.txt','status=FAIL\nsource_sha='+process.env.GITHUB_SHA+'\nerror='+String(e&&e.message||e)+'\n');process.exitCode=1;}finally{if(b)await b.close();}})();
          NODE
      - name: Persist result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/beta092-smoke.txt
          git commit -m "Record Localrent diagnostic [skip ci]" || true
          git push
      - name: Fail when smoke failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
