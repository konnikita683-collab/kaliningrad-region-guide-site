name: Beta 0.9.2 browser smoke

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "beta092/**"
      - ".github/workflows/beta092-smoke.yml"

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: python3 -m http.server 8000 > /tmp/beta-http.log 2>&1 &
      - name: Test preblogger beta
        id: smoke
        continue-on-error: true
        run: |
          mkdir -p status
          node <<'NODE'
          const fs=require('fs'); const {chromium}=require('playwright');
          (async()=>{let b,p;try{
            b=await chromium.launch({headless:true}); p=await b.newPage({viewport:{width:412,height:915},locale:'ru-RU'});
            await p.route('https://api.open-meteo.com/**',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({daily:{time:['2026-08-24','2026-08-25','2026-08-26','2026-08-27','2026-08-28'],weather_code:[1,2,1,3,2],temperature_2m_max:[24,23,25,22,21],temperature_2m_min:[18,17,19,16,15],precipitation_probability_max:[10,20,15,35,25]}})}));
            await p.route('https://marine-api.open-meteo.com/**',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({hourly:{time:['2026-08-24T12:00','2026-08-25T12:00','2026-08-26T12:00','2026-08-27T12:00','2026-08-28T12:00'],sea_surface_temperature:[19.1,19.0,18.9,18.7,18.5],wave_height:[0.4,0.5,0.6,0.5,0.4]}})}));
            await p.goto('http://127.0.0.1:8000/beta092/?ci=pb3',{waitUntil:'networkidle'}); await p.waitForSelector('#wizard'); await p.waitForTimeout(350);
            let body=await p.locator('body').innerText(); if(!body.includes('BETA 0.9.2 PB3'))throw new Error('PB3 badge missing');
            await p.locator('#a').fill('2026-08-24'); await p.locator('#b').fill('2026-08-28'); await p.locator('#next').click(); await p.locator('#ad').fill('2'); await p.locator('#ch').fill('2'); await p.waitForTimeout(200); await p.locator('[data-child-age="0"]').selectOption('10'); await p.locator('[data-child-age="1"]').selectOption('13'); await p.locator('#next').click(); await p.locator('button[data-g="city"][data-v="Зеленоградск"]').click();
            const stay=(await p.locator('.ob-lodging-head span').first().textContent()||'').trim(); if(!/24\s*авг.*28\s*авг/i.test(stay))throw new Error('DATE2 regression: '+stay);
            const yandex=await p.evaluate(()=>window.guideBuildYandexTravelUrl('Зеленоградск')); const ost=await p.evaluate(()=>window.guideBuildOstrovokUrl('Зеленоградск'));
            await p.evaluate(()=>{st.car='maybe';st.carDays=2;st.interests=['sea','nature'];build();}); await p.waitForTimeout(500); const days=p.locator('.day'); if(await days.count()!==5)throw new Error('Route days != 5'); if(await p.locator('[data-tab="days"]').count())await p.locator('[data-tab="days"]').click(); await p.waitForTimeout(900); await p.evaluate(()=>window.guideRefreshExcursions&&window.guideRefreshExcursions()); await p.waitForTimeout(120);
            const first=days.first(),last=days.nth(4); if(await first.locator('.guide-live-boundary-weather').count()!==1||await last.locator('.guide-live-boundary-weather').count()!==1)throw new Error('Boundary weather missing');
            const day2=await days.nth(1).locator('[data-tripster-day]').getAttribute('href'); const day3=await days.nth(2).locator('[data-tripster-day]').getAttribute('href'); const day4=await days.nth(3).locator('[data-tripster-day]').getAttribute('href');
            if(day2!=='https://experience.tripster.ru/experience/11686/')throw new Error('Zelenogradsk excursion wrong: '+day2);
            if(day3!=='https://experience.tripster.ru/experience/60689/')throw new Error('Curonian excursion wrong: '+day3);
            if(day4!=='https://experience.tripster.ru/experience/42825/')throw new Error('West coast excursion wrong: '+day4);
            await p.evaluate(()=>{st.car='yes';renderCar([{car:true},{car:true},{car:false},{car:true}]);}); await p.waitForTimeout(120); const localrent=await p.locator('a.rental-open[data-guide-partner="localrent"]').getAttribute('href');
            await p.locator('[data-tab="events"]').click(); await p.waitForTimeout(700); if(await p.evaluate(()=>window.guideEnsureEventPortals?window.guideEnsureEventPortals():false))await p.waitForTimeout(100); await p.evaluate(()=>window.guideRefreshExcursions&&window.guideRefreshExcursions()); await p.waitForTimeout(100);
            const afisha=await p.locator('[data-event-portal="afisha"]').getAttribute('href'),tripster=await p.locator('[data-event-portal="tripster"]').getAttribute('href');
            const ticketLinks=await p.locator('.guide-event-ticket-link').count(); if(ticketLinks<1)throw new Error('Event ticket links missing');
            fs.writeFileSync('status/beta092-smoke.txt','status=PASS\nsource_sha='+process.env.GITHUB_SHA+'\nstay='+stay+'\nweather=PASS\nyandex='+yandex+'\nostrovok='+ost+'\nlocalrent='+localrent+'\nafisha='+afisha+'\ntripster='+tripster+'\nexcursion_day2='+day2+'\nexcursion_day3='+day3+'\nexcursion_day4='+day4+'\nevent_ticket_links='+ticketLinks+'\nroute_days=5\n');
          }catch(e){let diag='';try{diag='\nweatherInstalled='+(await p.evaluate(()=>String(window.__guideBoundaryWeatherFixInstalled||'')))+'\neventInstalled='+(await p.evaluate(()=>String(window.__guideEventPortalFixInstalled||'')))+'\nexcursionInstalled='+(await p.evaluate(()=>String(window.__guideExcursionDayFixInstalled||'')))+'\nbody='+(await p.locator('body').innerText()).slice(-2200);}catch(_){}fs.writeFileSync('status/beta092-smoke.txt','status=FAIL\nsource_sha='+process.env.GITHUB_SHA+'\nerror='+String(e&&e.message||e)+diag+'\n');process.exitCode=1;}finally{if(b)await b.close();}})();
          NODE
      - name: Persist result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/beta092-smoke.txt
          git commit -m "Record Beta 0.9.2 PB3 smoke [skip ci]" || true
          git push
      - name: Fail when smoke failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
