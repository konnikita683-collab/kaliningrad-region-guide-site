name: Beta 0.9.2 browser smoke

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "beta092/**"
      - ".github/workflows/beta092-smoke.yml"

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: python3 -m http.server 8000 > /tmp/beta-http.log 2>&1 &
      - name: Inspect Ostrovok generation on DATE2
        id: smoke
        continue-on-error: true
        run: |
          mkdir -p status
          node <<'NODE'
          const fs=require('fs'); const {chromium}=require('playwright');
          (async()=>{let b,p;try{
            b=await chromium.launch({headless:true}); p=await b.newPage({viewport:{width:412,height:915}});
            await p.goto('http://127.0.0.1:8000/beta092/?ci=ostrovok-diag',{waitUntil:'networkidle'}); await p.waitForSelector('#wizard');
            const body=await p.locator('body').innerText(); if(!body.includes('BETA 0.9.2 DATE2')||body.includes('DATE2 ERROR'))throw new Error('DATE2 runtime patch not active');
            await p.locator('#a').fill('2026-08-24'); await p.locator('#b').fill('2026-08-28'); await p.locator('#next').click();
            await p.waitForSelector('#ad'); await p.locator('#next').click(); await p.waitForSelector('button[data-g="city"]');
            await p.locator('button[data-g="city"][data-v="Зеленоградск"]').click(); await p.waitForTimeout(200);
            const stay=(await p.locator('.ob-lodging-head span').first().textContent()||'').trim(); if(!/24\s*авг.*28\s*авг/i.test(stay))throw new Error('DATE2 regression: '+stay);
            const find=p.locator('button[data-lmode="find"][data-city="Зеленоградск"]'); await find.click(); await p.waitForTimeout(150);
            const providerCount=await p.locator('button[data-provider="ostrovok"][data-city="Зеленоградск"]').count();
            const fn=await p.evaluate(()=>({
              lodgingPreview:String(window.lodgingPreview),
              lodgingMode:String(window.lodgingMode),
              st:typeof st!=='undefined'?JSON.stringify(st):'NO_ST',
              setup:typeof lodgingSetup!=='undefined'?JSON.stringify(lodgingSetup):'NO_SETUP'
            }));
            let opened='';
            await p.evaluate(()=>{window.__ostCaptured='';window.open=function(u){window.__ostCaptured=String(u||'');return null;};});
            if(providerCount){await p.locator('button[data-provider="ostrovok"][data-city="Зеленоградск"]').click();await p.waitForTimeout(100);opened=await p.evaluate(()=>window.__ostCaptured||'');}
            fs.writeFileSync('status/beta092-smoke.txt','status=OST_DIAG\nsource_sha='+process.env.GITHUB_SHA+'\nstay='+stay+'\nprovider_count='+providerCount+'\nopened='+opened+'\nst='+fn.st+'\nsetup='+fn.setup+'\nlodgingPreview='+fn.lodgingPreview.replace(/\n/g,'\\n')+'\nlodgingMode='+fn.lodgingMode.replace(/\n/g,'\\n')+'\n');
          }catch(e){fs.writeFileSync('status/beta092-smoke.txt','status=FAIL\nsource_sha='+process.env.GITHUB_SHA+'\nerror='+String(e&&e.message||e)+'\n');process.exitCode=1;}finally{if(b)await b.close();}})();
          NODE
      - name: Persist result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/beta092-smoke.txt
          git commit -m "Record Ostrovok DATE2 diagnostic [skip ci]" || true
          git push
      - name: Fail when smoke failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
