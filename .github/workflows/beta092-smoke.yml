name: Beta 0.9.2 browser smoke

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "beta092/**"
      - ".github/workflows/beta092-smoke.yml"

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: python3 -m http.server 8000 > /tmp/beta-http.log 2>&1 &
      - name: Inspect actual wizard
        id: smoke
        continue-on-error: true
        run: |
          mkdir -p status
          node <<'NODE'
          const fs=require('fs'); const {chromium}=require('playwright');
          (async()=>{let b,p;try{
            b=await chromium.launch({headless:true}); p=await b.newPage({viewport:{width:412,height:915}});
            await p.goto('http://127.0.0.1:8000/beta092/?ci=legacy',{waitUntil:'networkidle'}); await p.waitForSelector('#wizard');
            await p.locator('#a').fill('2026-08-24'); await p.locator('#b').fill('2026-08-28'); await p.locator('#next').click(); await p.waitForTimeout(100);
            const step2=await p.locator('#step').innerHTML();
            await p.locator('#next').click(); await p.waitForTimeout(100);
            const step3=await p.locator('#step').innerHTML();
            const globals=await p.evaluate(()=>Object.keys(window).filter(k=>/trip|state|city|cities|stay|lodg/i.test(k)).slice(0,120));
            const storage=await p.evaluate(()=>Object.fromEntries(Object.keys(localStorage).map(k=>[k,localStorage.getItem(k)])));
            fs.writeFileSync('status/beta092-smoke.txt','status=DIAG\nsource_sha='+process.env.GITHUB_SHA+'\nstep2='+step2.replace(/\n/g,' ')+'\nstep3='+step3.replace(/\n/g,' ')+'\nglobals='+JSON.stringify(globals)+'\nstorage='+JSON.stringify(storage)+'\n');
          }catch(e){fs.writeFileSync('status/beta092-smoke.txt','status=FAIL\nsource_sha='+process.env.GITHUB_SHA+'\nerror='+String(e&&e.message||e)+'\n');process.exitCode=1;}finally{if(b)await b.close();}})();
          NODE
      - name: Persist result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/beta092-smoke.txt
          git commit -m "Record Beta 0.9.2 wizard diagnostic [skip ci]" || true
          git push
