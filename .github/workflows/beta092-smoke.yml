name: Beta 0.9.2 browser smoke

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "beta092/**"
      - ".github/workflows/beta092-smoke.yml"

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: python3 -m http.server 8000 > /tmp/beta-http.log 2>&1 &
      - name: Inspect actual wizard
        id: smoke
        continue-on-error: true
        run: |
          mkdir -p status
          node <<'NODE'
          const fs=require('fs'); const {chromium}=require('playwright');
          (async()=>{let b,p;try{
            b=await chromium.launch({headless:true}); p=await b.newPage({viewport:{width:412,height:915}});
            await p.goto('http://127.0.0.1:8000/beta092/?ci=legacy2',{waitUntil:'networkidle'}); await p.waitForSelector('#wizard');
            await p.locator('#a').fill('2026-08-24'); await p.locator('#b').fill('2026-08-28'); await p.locator('#next').click(); await p.waitForTimeout(100);
            await p.locator('#next').click(); await p.waitForTimeout(150);
            const before=await p.locator('#step').innerHTML();
            const fn=await p.evaluate(()=>({
              currentTripDates: String(window.currentTripDates),
              lodgingSplit: String(window.lodgingSplit),
              ensureLodgingDates: String(window.ensureLodgingDates),
              lodgingStepHtml: String(window.lodgingStepHtml),
              bindLodgingStep: String(window.bindLodgingStep),
              globals:Object.keys(window).filter(k=>/render|step|pref|selected|city|cities|lodg|state/i.test(k)).slice(0,160)
            }));
            const svet=p.locator('button[data-g="city"][data-v="Светлогорск"]'); await svet.click(); await p.waitForTimeout(250);
            const after=await p.locator('#step').innerHTML();
            const selected=await p.locator('button[data-g="city"].sel').allTextContents();
            const storage=await p.evaluate(()=>Object.fromEntries(Object.keys(localStorage).map(k=>[k,localStorage.getItem(k)])));
            fs.writeFileSync('status/beta092-smoke.txt','status=DIAG2\nsource_sha='+process.env.GITHUB_SHA+'\nbefore='+before.replace(/\n/g,' ')+'\nafter='+after.replace(/\n/g,' ')+'\nselected='+JSON.stringify(selected)+'\nfunctions='+JSON.stringify(fn)+'\nstorage='+JSON.stringify(storage)+'\n');
          }catch(e){fs.writeFileSync('status/beta092-smoke.txt','status=FAIL\nsource_sha='+process.env.GITHUB_SHA+'\nerror='+String(e&&e.message||e)+'\n');process.exitCode=1;}finally{if(b)await b.close();}})();
          NODE
      - name: Persist result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/beta092-smoke.txt
          git commit -m "Record Beta 0.9.2 wizard diagnostic [skip ci]" || true
          git push
