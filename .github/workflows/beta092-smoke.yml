name: Beta 0.9.2 browser smoke

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "beta092/**"
      - ".github/workflows/beta092-smoke.yml"

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: python3 -m http.server 8000 > /tmp/beta-http.log 2>&1 &
      - name: Test DATE2, Yandex, Ostrovok and Localrent
        id: smoke
        continue-on-error: true
        run: |
          mkdir -p status
          node <<'NODE'
          const fs=require('fs'); const {chromium}=require('playwright');
          (async()=>{let b,p;try{
            b=await chromium.launch({headless:true});p=await b.newPage({viewport:{width:412,height:915},locale:'ru-RU'});
            await p.goto('http://127.0.0.1:8000/beta092/?ci=lr1',{waitUntil:'networkidle'});await p.waitForSelector('#wizard');await p.waitForTimeout(350);
            let body=await p.locator('body').innerText();
            if(!body.includes('BETA 0.9.2 LR1')||body.includes('ERROR'))throw new Error('LR1 runtime not active: '+body.slice(-350));
            await p.locator('#a').fill('2026-08-24');await p.locator('#b').fill('2026-08-28');await p.locator('#next').click();
            await p.waitForSelector('#ad');await p.locator('#ad').fill('2');await p.locator('#ch').fill('2');await p.waitForTimeout(250);
            const ageCount=await p.locator('#guideLegacyChildAges [data-child-age]').count();if(ageCount!==2)throw new Error('Expected 2 child age fields, got '+ageCount);
            await p.locator('[data-child-age="0"]').selectOption('10');await p.locator('[data-child-age="1"]').selectOption('13');
            await p.locator('#next').click();await p.waitForSelector('button[data-g="city"]');
            const initial=await p.locator('button[data-g="city"].sel').count();if(initial!==0)throw new Error('Preselected cities='+initial);
            await p.locator('button[data-g="city"][data-v="Зеленоградск"]').click();await p.waitForTimeout(200);
            const stay=(await p.locator('.ob-lodging-head span').first().textContent()||'').trim();if(!/24\s*авг.*28\s*авг/i.test(stay))throw new Error('DATE2 regression: '+stay);
            await p.locator('button[data-lmode="find"][data-city="Зеленоградск"]').click();await p.waitForTimeout(150);
            const yandexExpected='https://travel.yandex.ru/hotels/zelenogradsk/?adults=2&checkinDate=2026-08-24&checkoutDate=2026-08-28&childrenAges=10%2C13&roomCount=1&affiliate_clid=15309307&affiliate_vid=housingapp&erid=5jtCeReNx12oajzh1DMXueG&utm_source=distribution&utm_medium=cpa';
            const yandexGenerated=await p.evaluate(()=>window.guideBuildYandexTravelUrl('Зеленоградск'));if(yandexGenerated!==yandexExpected)throw new Error('Yandex regression: '+yandexGenerated);
            const ostExpected='https://ostrovok.ru/hotel/russia/zelenogradsk/?q=6135696&dates=24.08.2026-28.08.2026&guests=2&search=yes';
            const ostGenerated=await p.evaluate(()=>window.guideBuildOstrovokUrl('Зеленоградск'));if(ostGenerated!==ostExpected)throw new Error('Ostrovok regression: '+ostGenerated);
            await p.evaluate(()=>{st.car='yes';renderCar([{car:true},{car:true},{car:false},{car:true}]);});await p.waitForTimeout(150);
            const lr=p.locator('a.rental-open[data-guide-partner="localrent"]');if(await lr.count()!==1)throw new Error('Localrent partner anchor not found');
            const localrent=await lr.getAttribute('href');
            const lrExpected='https://www.localrent.com/ru/russia/kaliningrad/?marker=carapp&r=17555';
            if(localrent!==lrExpected)throw new Error('Localrent URL wrong: '+localrent);
            const disclosure=await p.locator('.guide-localrent-disclosure').innerText();if(!/carapp/i.test(disclosure))throw new Error('Localrent disclosure missing');
            fs.writeFileSync('status/beta092-smoke.txt','status=PASS\nsource_sha='+process.env.GITHUB_SHA+'\ninitial_cities=0\nstay='+stay+'\nchild_ages=10,13\nyandex='+yandexGenerated+'\nostrovok='+ostGenerated+'\nlocalrent='+localrent+'\ndisclosure='+disclosure+'\n');
          }catch(e){let diag='';try{diag='\nbody='+(await p.locator('body').innerText()).slice(-1800);}catch(_){}fs.writeFileSync('status/beta092-smoke.txt','status=FAIL\nsource_sha='+process.env.GITHUB_SHA+'\nerror='+String(e&&e.message||e)+diag+'\n');process.exitCode=1;}finally{if(b)await b.close();}})();
          NODE
      - name: Persist result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/beta092-smoke.txt
          git commit -m "Record Beta 0.9.2 LR1 smoke [skip ci]" || true
          git push
      - name: Fail when smoke failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
