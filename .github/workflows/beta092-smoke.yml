name: Beta 0.9.2 browser smoke

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "beta092/**"
      - ".github/workflows/beta092-smoke.yml"

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: python3 -m http.server 8000 > /tmp/beta-http.log 2>&1 &
      - name: Diagnose generated OST5 script
        id: smoke
        continue-on-error: true
        run: |
          mkdir -p status
          node <<'NODE'
          const fs=require('fs'); const {chromium}=require('playwright');
          (async()=>{let b,p,logs=[];try{
            b=await chromium.launch({headless:true});p=await b.newPage({viewport:{width:412,height:915}});
            p.on('console',m=>logs.push(m.type()+':'+m.text()));p.on('pageerror',e=>logs.push('pageerror:'+e.message));
            await p.goto('http://127.0.0.1:8000/beta092/?ci=ost5script',{waitUntil:'networkidle'});await p.waitForSelector('#wizard');await p.waitForTimeout(300);
            const diag=await p.evaluate(()=>({body:(document.body.innerText||'').slice(0,1800),scripts:Array.from(document.scripts).slice(-4).map((s,i)=>({i,src:s.src||'',text:(s.textContent||'').slice(-12000)}))}));
            const badge=await p.locator('#beta092Date2Badge').count()?await p.locator('#beta092Date2Badge').innerText():'NO_BADGE';
            fs.writeFileSync('status/beta092-smoke.txt','status=DIAG_SCRIPT\nsource_sha='+process.env.GITHUB_SHA+'\nbadge='+badge+'\nlogs='+JSON.stringify(logs)+'\nscripts='+JSON.stringify(diag.scripts)+'\nbody='+diag.body.replace(/\n/g,' | ')+'\n');
            if(badge!=='BETA 0.9.2 OST5')process.exitCode=1;
          }catch(e){fs.writeFileSync('status/beta092-smoke.txt','status=FAIL\nsource_sha='+process.env.GITHUB_SHA+'\nerror='+String(e&&e.message||e)+'\nlogs='+JSON.stringify(logs)+'\n');process.exitCode=1;}finally{if(b)await b.close();}})();
          NODE
      - name: Persist result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/beta092-smoke.txt
          git commit -m "Record generated OST5 script diagnostic [skip ci]" || true
          git push
      - name: Fail when smoke failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
