name: RZD ESR scrape fast
on:
  push:
    branches: [rzd-esr-build-20260908]
permissions:
  contents: read
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect actual RailLogistic markup
        run: |
          python - <<'PY'
          import re, urllib.request
          url='https://www.raillogistic.ru/stations.php?page=1'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=40) as r:
              text=r.read().decode('utf-8','replace')
          print('LEN',len(text))
          for needle in ['station','stations','ЕСР','ОКТЯБРЬСКАЯ','td','table','href']:
              print('COUNT',needle,text.lower().count(needle.lower()))
          for pat in [r'.{0,500}010100.{0,1200}', r'.{0,500}station.{0,1500}', r'.{0,500}ЕСР.{0,1500}']:
              m=re.search(pat,text,re.I|re.S)
              print('MATCH',pat, (m.group(0) if m else 'NONE'))
          print('HEAD',text[:8000])
          PY
