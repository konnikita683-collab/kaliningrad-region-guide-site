name: RZD ESR scrape fast
on:
  push:
    branches: [rzd-esr-build-20260908]
permissions:
  contents: read
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Concurrent scrape
        run: |
          python - <<'PY'
          import csv, html, re, urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          H={'User-Agent':'Mozilla/5.0 (compatible; RZD-reference-build/1.0)'}
          def one(page):
              url=f'https://www.raillogistic.ru/stations.php?page={page}'
              req=urllib.request.Request(url,headers=H)
              with urllib.request.urlopen(req,timeout=40) as r: text=r.read().decode('utf-8','replace')
              out=[]
              for tr in re.findall(r'<tr[^>]*>(.*?)</tr>',text,re.I|re.S):
                  if 'station.php?id=' not in tr: continue
                  cells=re.findall(r'<td[^>]*>(.*?)</td>',tr,re.I|re.S)
                  vals=[]
                  for c in cells:
                      c=re.sub(r'<br\s*/?>',' ',c,flags=re.I); c=re.sub(r'<[^>]+>',' ',c); c=html.unescape(c); c=re.sub(r'\s+',' ',c).strip(); vals.append(c)
                  if len(vals)<5: continue
                  core=vals[-6:] if len(vals)>=6 else vals
                  if len(core)<5: continue
                  m=re.search(r'\d{4,6}',core[0].replace(' ',''))
                  if not m: continue
                  esr=m.group(0).zfill(6)
                  out.append([esr,core[1],core[2],core[3],core[4],core[5] if len(core)>5 else '',page,url])
              return page,out
          rows=[]
          with ThreadPoolExecutor(max_workers=20) as ex:
              fs=[ex.submit(one,p) for p in range(1,249)]
              for f in as_completed(fs):
                  p,r=f.result(); rows.extend(r); print(p,len(r),len(rows),flush=True)
          seen=set(); out=[]
          for r in sorted(rows,key=lambda x:(x[6],x[0],x[1])):
              k=(r[0],r[1])
              if k not in seen: seen.add(k); out.append(r)
          Path('rzd_build').mkdir(exist_ok=True)
          fn='rzd_build/raillogistic_stations_2026-09-08.csv'
          with open(fn,'w',newline='',encoding='utf-8-sig') as f:
              w=csv.writer(f); w.writerow(['Код ЕСР','Наименование','Тип объекта','Железная дорога','Субъект/георегион источника','Координаты','Страница','URL']); w.writerows(out)
          print('FINAL',len(out),'UNIQUE_ESR',len({r[0] for r in out}),flush=True)
          if len(out)<12000: raise SystemExit(f'parsed {len(out)}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: raillogistic-stations-fast-20260908
          path: rzd_build/raillogistic_stations_2026-09-08.csv
          retention-days: 1
