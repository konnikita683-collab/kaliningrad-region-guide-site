name: PB5 Android smoke
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "beta092pb5/**"
      - ".github/workflows/pb5-smoke.yml"
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - run: python3 -m http.server 8000 >/tmp/http.log 2>&1 &
      - id: smoke
        continue-on-error: true
        run: |
          mkdir -p status
          node <<'NODE'
          const fs=require('fs');const{chromium}=require('playwright');
          (async()=>{let b,p;try{
            b=await chromium.launch({headless:true});
            p=await b.newPage({viewport:{width:412,height:915},deviceScaleFactor:2.625,isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (Linux; Android 15; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Mobile Safari/537.36',locale:'ru-RU'});
            await p.route('https://api.open-meteo.com/**',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({daily:{time:['2026-08-24','2026-08-25','2026-08-26','2026-08-27','2026-08-28'],weather_code:[1,2,1,3,2],temperature_2m_max:[24,23,25,22,21],temperature_2m_min:[18,17,19,16,15],precipitation_probability_max:[10,20,15,35,25]}})}));
            await p.route('https://marine-api.open-meteo.com/**',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({hourly:{time:['2026-08-24T12:00','2026-08-25T12:00','2026-08-26T12:00','2026-08-27T12:00','2026-08-28T12:00'],sea_surface_temperature:[19.1,19.0,18.9,18.7,18.5],wave_height:[0.4,0.5,0.6,0.5,0.4]}})}));
            await p.goto('http://127.0.0.1:8000/beta092pb5/?ci=android',{waitUntil:'networkidle'});await p.waitForSelector('#wizard',{timeout:15000});
            let txt=await p.locator('body').innerText();if(!txt.includes('BETA 0.9.2 PB5'))throw new Error('PB5 badge missing');if(txt.trim().length<150)throw new Error('Blank body');
            await p.locator('#a').fill('2026-08-24');await p.locator('#b').fill('2026-08-28');await p.locator('#next').click();await p.locator('#ad').fill('2');await p.locator('#ch').fill('2');await p.waitForTimeout(150);await p.locator('[data-child-age="0"]').selectOption('10');await p.locator('[data-child-age="1"]').selectOption('13');await p.locator('#next').click();await p.locator('button[data-g="city"][data-v="Зеленоградск"]').click();
            const stay=(await p.locator('.ob-lodging-head span').first().textContent()||'').trim();if(!/24\s*авг.*28\s*авг/i.test(stay))throw new Error('DATE regression '+stay);
            const yandex=await p.evaluate(()=>window.guideBuildYandexTravelUrl('Зеленоградск'));if(!/checkinDate=2026-08-24/.test(yandex)||!/childrenAges=10%2C13/.test(yandex))throw new Error('Yandex regression');
            const ost=await p.evaluate(()=>window.guideBuildOstrovokUrl('Зеленоградск'));if(!/q=6135696/.test(ost)||!/dates=24.08.2026-28.08.2026/.test(ost))throw new Error('Ostrovok regression');
            await p.evaluate(()=>{st.car='maybe';st.carDays=2;st.interests=['sea','nature'];build();});await p.waitForTimeout(2200);const days=p.locator('.day');if(await days.count()!==5)throw new Error('Route != 5');
            for(let i=0;i<5;i++){const d=days.nth(i);if(await d.locator('.guide-live-weather').count()!==1)throw new Error('weather count day '+i);const t=await d.innerText();if(/температура появится с прогнозом|волна появится с прогнозом/i.test(t))throw new Error('legacy weather remains day '+i);}
            const first=await days.first().innerText();if(!/19\.1°/.test(first)||!/0\.4 м/.test(first))throw new Error('first sea data missing');
            if(await p.locator('.guide-day-notes').count()!==5)throw new Error('notes missing');const ta=days.nth(1).locator('.guide-day-notes textarea');await ta.fill('Бронь экскурсии 10:00');await p.evaluate(()=>window.guideRefreshDayTools&&window.guideRefreshDayTools());await p.waitForTimeout(150);if((await ta.inputValue())!=='Бронь экскурсии 10:00')throw new Error('note not persisted');
            const d3=days.nth(2);await d3.evaluate(card=>{const h=card.querySelector('h2,h3');if(h)h.textContent='Форты Калининграда и Амалиенау';});await p.waitForTimeout(500);const kal=await d3.locator('[data-tripster-catalog]').getAttribute('href');if(kal!=='https://experience.tripster.ru/experience/Kaliningrad/')throw new Error('Kaliningrad excursion missing '+kal);
            const mark=d3.locator('.guide-booked-toggle');await mark.click();await p.waitForTimeout(150);if(!/забронирован/i.test(await d3.locator('.guide-day-excursion').innerText()))throw new Error('booking marker missing');
            await p.evaluate(()=>{st.car='yes';renderCar([{car:true},{car:true},{car:false},{car:true}]);});await p.waitForTimeout(120);const localrent=await p.locator('a.rental-open[data-guide-partner="localrent"]').getAttribute('href');if(!/marker=carapp/.test(localrent))throw new Error('Localrent regression');
            await p.locator('[data-tab="events"]').click();await p.waitForTimeout(500);if(await p.locator('.guide-event-ticket-link').count()<1)throw new Error('Event links missing');
            fs.writeFileSync('status/pb5-smoke.txt','status=PASS\nsource_sha='+process.env.GITHUB_SHA+'\nandroid_body=PASS\nroute_days=5\nweather_blocks=5\nlegacy_weather=0\nfirst_water=19.1C\nfirst_wave=0.4m\nkaliningrad_catalog=PASS\nnotes=PASS\nbooking_marker=PASS\nyandex=PASS\nostrovok=PASS\nlocalrent=PASS\n');
          }catch(e){let body='';try{body=(await p.locator('body').innerText()).slice(0,2400);}catch(_){}fs.writeFileSync('status/pb5-smoke.txt','status=FAIL\nsource_sha='+process.env.GITHUB_SHA+'\nerror='+String(e&&e.message||e)+'\nbody='+body+'\n');process.exitCode=1;}finally{if(b)await b.close();}})();
          NODE
      - if: always()
        run: |
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com";git add status/pb5-smoke.txt;git commit -m "Record PB5 Android smoke [skip ci]" || true;git push
      - if: steps.smoke.outcome == 'failure'
        run: exit 1
