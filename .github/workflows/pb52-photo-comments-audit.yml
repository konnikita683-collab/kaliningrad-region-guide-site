name: PB5.2 photo comments audit
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/pb52-photo-comments-audit.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - run: python3 -m http.server 8000 >/tmp/http.log 2>&1 &
      - run: |
          node <<'NODE'
          const{chromium}=require('playwright');
          (async()=>{let b;try{
            b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:412,height:915},isMobile:true,hasTouch:true,locale:'ru-RU'});
            await p.goto('http://127.0.0.1:8000/beta092pb52/?ci=photoaudit',{waitUntil:'networkidle'});await p.waitForSelector('#wizard',{timeout:15000});
            await p.locator('#a').fill('2026-08-25');await p.locator('#b').fill('2026-08-29');await p.locator('#next').click();
            await p.locator('#ad').fill('2');await p.locator('#ch').fill('2');await p.waitForTimeout(120);await p.locator('[data-child-age="0"]').selectOption('10');await p.locator('[data-child-age="1"]').selectOption('13');await p.locator('#next').click();await p.locator('button[data-g="city"][data-v="Зеленоградск"]').click();
            await p.evaluate(()=>{st.car='maybe';st.carDays=2;st.interests=['sea','nature'];build();});await p.waitForFunction(()=>document.querySelectorAll('.day').length===5,{timeout:6000});
            for(const d of await p.locator('.day').all()){const t=d.locator('.day-toggle');if(await t.count()&&/Открыть/.test(await t.innerText()))await t.click();}
            await p.waitForTimeout(1000);
            const audit=await p.evaluate(()=>{
              const imgs=[...document.images].map((img,i)=>{const host=img.closest('.place-card,.food-card,.restaurant-card,.event-card,.review,.reviews,.card,.day')||img.parentElement;return{i,src:img.currentSrc||img.src,alt:img.alt||'',cls:img.className,hostCls:host&&host.className,text:host&&host.innerText?host.innerText.replace(/\s+/g,' ').trim().slice(0,700):''};});
              const textNodes=[...document.querySelectorAll('*')].filter(e=>/отзыв|комментар|фото посет|пользовател/i.test(e.textContent||'')&&!e.children.length).map(e=>({tag:e.tagName,cls:e.className,text:(e.textContent||'').trim(),host:(e.closest('.card,.day,.place-card,.food-card,.restaurant-card')||e.parentElement)?.innerText?.replace(/\s+/g,' ').trim().slice(0,700)}));
              return{images:imgs,textNodes};
            });
            console.log('PHOTO_AUDIT='+JSON.stringify(audit));
          }finally{if(b)await b.close();}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
