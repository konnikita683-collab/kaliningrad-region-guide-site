name: RZD ESR scrape
on:
  push:
    branches: [rzd-esr-build-20260908]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scrape RailLogistic station directory
        run: |
          python - <<'PY'
          import csv, html, re, time, urllib.request
          from pathlib import Path
          rows=[]
          headers={'User-Agent':'Mozilla/5.0 (compatible; RZD-reference-build/1.0)'}
          for page in range(1,249):
              url=f'https://www.raillogistic.ru/stations.php?page={page}'
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  text=r.read().decode('utf-8','replace')
              # Each listing row contains station.php?id=..., ESR, name, type, railway, RF region, coords.
              # Parse table rows conservatively from HTML.
              trs=re.findall(r'<tr[^>]*>(.*?)</tr>',text,re.I|re.S)
              for tr in trs:
                  if 'station.php?id=' not in tr: continue
                  cells=re.findall(r'<td[^>]*>(.*?)</td>',tr,re.I|re.S)
                  vals=[]
                  for c in cells:
                      c=re.sub(r'<br\s*/?>',' ',c,flags=re.I)
                      c=re.sub(r'<[^>]+>',' ',c)
                      c=html.unescape(c)
                      c=re.sub(r'\s+',' ',c).strip()
                      vals.append(c)
                  if len(vals) < 5: continue
                  # find first cell containing 4-6 digit ESR
                  esr=''
                  for v in vals:
                      m=re.search(r'\b\d{4,6}\b',v.replace(' ',''))
                      if m:
                          esr=m.group(0).zfill(6); break
                  if not esr: continue
                  # Page table order is ESR, name, type, railway, RF region, coordinates
                  core=vals[-6:] if len(vals)>=6 else vals
                  if len(core)>=5:
                      e,name,typ,rail,region=core[:5]
                      coords=core[5] if len(core)>5 else ''
                      m=re.search(r'\d{4,6}',e.replace(' ','')); e=(m.group(0).zfill(6) if m else esr)
                      rows.append([e,name,typ,rail,region,coords,page,url])
              print(page, len(rows), flush=True)
              time.sleep(0.03)
          # de-duplicate exact ESR+name preserving rows for ESR conflicts
          seen=set(); out=[]
          for row in rows:
              k=(row[0],row[1])
              if k not in seen:
                  seen.add(k); out.append(row)
          Path('rzd_build').mkdir(exist_ok=True)
          with open('rzd_build/raillogistic_stations_2026-09-08.csv','w',newline='',encoding='utf-8-sig') as f:
              w=csv.writer(f); w.writerow(['Код ЕСР','Наименование','Тип объекта','Железная дорога','Субъект/георегион источника','Координаты','Страница','URL']); w.writerows(out)
          print('FINAL',len(out),'unique_esr',len({r[0] for r in out}))
          if len(out) < 12000:
              raise SystemExit(f'Only {len(out)} rows parsed; expected >=12000')
          PY
      - name: Upload station master
        uses: actions/upload-artifact@v4
        with:
          name: raillogistic-stations-20260908
          path: rzd_build/raillogistic_stations_2026-09-08.csv
          retention-days: 1
