name: Guest age DOM discovery
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/guest-age-discovery.yml"
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture guest step DOM
        run: |
          mkdir -p status
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          node <<'NODE'
          const fs=require('fs');const {chromium}=require('playwright');
          (async()=>{let b,p;try{b=await chromium.launch({headless:true});p=await b.newPage({viewport:{width:412,height:915}});await p.goto('http://127.0.0.1:8000/beta092/?ci=guestdom',{waitUntil:'networkidle'});await p.waitForSelector('#wizard');await p.locator('#a').fill('2026-08-24');await p.locator('#b').fill('2026-08-28');await p.locator('#next').click();await p.waitForTimeout(250);const step=await p.locator('#step').innerHTML();const globals=await p.evaluate(()=>({st:typeof st!=='undefined'?st:null}));fs.writeFileSync('status/guest-age-discovery.txt','status=OK\nstep='+step.replace(/\n/g,' ')+'\nst='+JSON.stringify(globals.st)+'\n');}catch(e){fs.writeFileSync('status/guest-age-discovery.txt','status=FAIL\nerror='+String(e&&e.message||e)+'\n');process.exitCode=1;}finally{if(b)await b.close();}})();
          NODE
      - name: Persist
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/guest-age-discovery.txt
          git commit -m "Record guest step DOM [skip ci]" || true
          git push
