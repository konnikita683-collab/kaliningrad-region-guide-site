name: PB4 Android smoke
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "beta092pb4/**"
      - ".github/workflows/pb4-smoke.yml"
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - run: python3 -m http.server 8000 >/tmp/http.log 2>&1 &
      - id: smoke
        continue-on-error: true
        run: |
          mkdir -p status
          node <<'NODE'
          const fs=require('fs');const{chromium}=require('playwright');
          (async()=>{let b,p;try{
            b=await chromium.launch({headless:true});
            p=await b.newPage({viewport:{width:412,height:915},deviceScaleFactor:2.625,isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (Linux; Android 15; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Mobile Safari/537.36',locale:'ru-RU'});
            await p.route('https://api.open-meteo.com/**',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({daily:{time:['2026-08-24','2026-08-25','2026-08-26','2026-08-27','2026-08-28'],weather_code:[1,2,1,3,2],temperature_2m_max:[24,23,25,22,21],temperature_2m_min:[18,17,19,16,15],precipitation_probability_max:[10,20,15,35,25]}})}));
            await p.route('https://marine-api.open-meteo.com/**',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({hourly:{time:['2026-08-24T12:00','2026-08-25T12:00','2026-08-26T12:00','2026-08-27T12:00','2026-08-28T12:00'],sea_surface_temperature:[19.1,19.0,18.9,18.7,18.5],wave_height:[0.4,0.5,0.6,0.5,0.4]}})}));
            await p.goto('http://127.0.0.1:8000/beta092pb4/?ci=android',{waitUntil:'networkidle'});await p.waitForSelector('#wizard',{timeout:15000});
            let txt=await p.locator('body').innerText();if(!txt.includes('BETA 0.9.2 PB4'))throw new Error('PB4 badge missing');if(txt.trim().length<150)throw new Error('Blank/too short body');
            await p.locator('#a').fill('2026-08-24');await p.locator('#b').fill('2026-08-28');await p.locator('#next').click();await p.locator('#ad').fill('2');await p.locator('#ch').fill('2');await p.waitForTimeout(150);await p.locator('[data-child-age="0"]').selectOption('10');await p.locator('[data-child-age="1"]').selectOption('13');await p.locator('#next').click();await p.locator('button[data-g="city"][data-v="Зеленоградск"]').click();
            await p.evaluate(()=>{st.car='maybe';st.carDays=2;st.interests=['sea','nature'];build();});await p.waitForTimeout(1200);const days=p.locator('.day');if(await days.count()!==5)throw new Error('Route != 5');if(await p.locator('[data-tab="days"]').count())await p.locator('[data-tab="days"]').click();await p.waitForTimeout(1200);
            if(await p.locator('.guide-live-weather').count()!==5)throw new Error('Live weather not on all 5 days: '+await p.locator('.guide-live-weather').count());const first=days.first();const firstText=await first.innerText();if(!/19\.1°/.test(firstText)||!/0\.4 м/.test(firstText))throw new Error('First-day marine values missing: '+firstText.slice(0,900));if(/Прогноз ближе к дате/i.test(firstText))throw new Error('Stale first-day forecast remains');
            const cats=p.locator('[data-tripster-catalog]');if(await cats.count()<3)throw new Error('Catalog links missing');const hrefs=await cats.evaluateAll(as=>as.map(a=>a.href));if(hrefs.some(h=>/\/experience\/\d+\/?$/.test(h)))throw new Error('Specific possibly sold-out excursion still used: '+hrefs.join(','));
            await p.locator('[data-tab="events"]').click();await p.waitForTimeout(500);if(await p.locator('.guide-event-ticket-link').count()<1)throw new Error('Event ticket links missing');
            fs.writeFileSync('status/pb4-smoke.txt','status=PASS\nsource_sha='+process.env.GITHUB_SHA+'\nandroid_body=PASS\nroute_days=5\nweather_days=5\nfirst_water=19.1C\nfirst_wave=0.4m\nexcursion_catalog_links='+await cats.count()+'\nevent_links='+await p.locator('.guide-event-ticket-link').count()+'\n');
          }catch(e){let body='';try{body=(await p.locator('body').innerText()).slice(0,1800);}catch(_){}fs.writeFileSync('status/pb4-smoke.txt','status=FAIL\nsource_sha='+process.env.GITHUB_SHA+'\nerror='+String(e&&e.message||e)+'\nbody='+body+'\n');process.exitCode=1;}finally{if(b)await b.close();}})();
          NODE
      - if: always()
        run: |
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com";git add status/pb4-smoke.txt;git commit -m "Record PB4 Android smoke [skip ci]" || true;git push
      - if: steps.smoke.outcome == 'failure'
        run: exit 1
