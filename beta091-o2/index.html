<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>Гайд по Калининградской области — Ostrovok O2</title>
<style>:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4eee4;color:#1f2a2b;display:grid;place-items:center;min-height:100vh}.load{padding:24px;text-align:center}.load b{display:block;font-size:20px;margin-bottom:8px}.muted{color:#6d736e;font-size:14px}.err{max-width:620px;line-height:1.5}</style>
</head>
<body>
<div class="load"><b>Гайд по Калининградской области</b><div class="muted">Загрузка теста Ostrovok O2…</div></div>
<script>
(async()=>{
try{
  const files=['part-000.txt','p001-0.txt','p001-1.txt','p001-2.txt','p001-3.txt','p001-4.txt','p001-5.txt','p001-6.txt','part-002.txt','part-003.txt','part-004.txt','part-005.txt','part-006.txt'];
  const stamp='20260824-ostrovok-o2-isolated';
  const parts=await Promise.all(files.map(async name=>{const r=await fetch('../beta/data/'+name+'?v='+stamp,{cache:'no-store'});if(!r.ok)throw new Error('data:'+name);let text=await r.text();if(name.startsWith('p001-'))text=text.slice(text.indexOf('\n')+1);return text;}));
  const encoded=parts.join('').replace(/\s+/g,'');
  const binary=atob(encoded),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  if(!('DecompressionStream' in window))throw new Error('browser');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  let html=await new Response(stream).text();
  const replaceModules=['guest-ages.js','commerce-core.js','housing-commerce.js','beta-runtime.js'];
  for(const name of replaceModules){const escaped=name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');const re=new RegExp("<script\\s+data-guide=[\"']"+escaped+"[\"'][^>]*>[\\s\\S]*?<\\/script>",'gi');html=html.replace(re,'');}
  const close='<'+'/script>';
  const guard='<script>(function(){var routes={"Калининград":"kaliningrad","Зеленоградск":"zelenogradsk","Светлогорск":"svetlogorsk","Пионерский":"pionerskiy","Янтарный":"yantarny","Балтийск":"baltiysk","Гусев":"gusev"};function dot(v){var m=String(v||"").match(/^(\\d{4})-(\\d{2})-(\\d{2})$/);return m?m[3]+"."+m[2]+"."+m[1]:"";}function stay(city){try{var x=JSON.parse(localStorage.getItem("guideLodgingOnboarding")||"{\\"cities\\":{}}"),c=x.cities&&x.cities[city]||{};return{start:c.start||"",end:c.end||""};}catch(_){return{start:"",end:""};}}document.addEventListener("click",function(e){var b=e.target&&e.target.closest&&e.target.closest("[data-provider=\\"ostrovok\\"][data-city]");if(!b)return;e.preventDefault();e.stopImmediatePropagation();var city=b.dataset.city,slug=routes[city]||"kaliningrad",u="https://ostrovok.ru/hotel/russia/"+encodeURIComponent(slug)+"/",s=stay(city),a=dot(s.start),z=dot(s.end);if(a&&z)u+="?dates="+encodeURIComponent(a+"-"+z);location.href=u;},true);function mark(){if(document.getElementById("ostrovokO2Badge"))return;var el=document.createElement("div");el.id="ostrovokO2Badge";el.textContent="OSTROVOK O2";el.style.cssText="position:fixed;right:10px;top:10px;z-index:100000;padding:5px 8px;border-radius:999px;background:#263633;color:#fff;font:800 10px/1 system-ui;pointer-events:none";document.body.appendChild(el);}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",mark,{once:true});else mark();})();'+close;
  html=html.replace(/<body([^>]*)>/i,function(m){return m+guard;});
  const injection=['<script src="../beta091/modules/commerce-core.js?v='+stamp+'">'+close,'<script src="../beta091/modules/guest-ages.js?v='+stamp+'">'+close,'<script src="../beta091/modules/housing-commerce.js?v='+stamp+'">'+close,'<script src="../beta091/modules/beta-runtime.js?v='+stamp+'">'+close].join('');
  html=html.replace(/<\/body>/i,injection+'</body>');
  document.open();document.write(html);document.close();
}catch(e){document.body.innerHTML='<div class="load err"><b>Ostrovok O2 не загрузился</b><div class="muted">'+String(e&&e.message||e)+'</div></div>';}
})();
</script>
</body>
</html>
